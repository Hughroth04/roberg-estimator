      var len = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
      if (len > 0.001) {
        var scale = Math.min(len, LETTER_WIDTH * 0.08) / len;
        x2 = x1 + (x2 - x1) * scale;
        y2 = y1 + (y2 - y1) * scale;
      }
    }
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.setLineDash([14, 10]);
    ctx.strokeStyle = COLORS.preview;
    ctx.lineWidth = STROKE_WIDTH;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function hasRootOutline() {
    for (var i = 0; i < completedShapes.length; i++) {
      if (isRootShape(i)) return true;
    }
    return false;
  }

  function isNearPoint(a, b, radius) {
    var dx = a.x - b.x;
    var dy = a.y - b.y;
    return dx * dx + dy * dy <= radius * radius;
  }

  function pointDist(a, b) {
    var dx = a.x - b.x;
    var dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function isEdgeNearlyAxisAligned(p1, p2, maxSkewRatio) {
    var dx = Math.abs(p2.x - p1.x);
    var dy = Math.abs(p2.y - p1.y);
    var len = Math.max(dx, dy);
    if (len < MIN_SEGMENT_PX) return false;
    return Math.min(dx, dy) / len <= maxSkewRatio;
  }

  function rectifyOutlinePoints(points) {
    if (points.length !== 4) {
      return { points: points.map(function(p) { return { x: p.x, y: p.y }; }), leveled: false };
    }
    var raw = points.map(function(p) { return { x: p.x, y: p.y }; });
    var i;
    for (i = 0; i < 4; i++) {
      if (!isEdgeNearlyAxisAligned(raw[i], raw[(i + 1) % 4], RECTIFY_EDGE_SKEW_RATIO)) {
        return { points: raw, leveled: false };
      }
    }
    var minX = Infinity;
    var maxX = -Infinity;
    var minY = Infinity;
    var maxY = -Infinity;
    for (i = 0; i < 4; i++) {
      minX = Math.min(minX, raw[i].x);
      maxX = Math.max(maxX, raw[i].x);
      minY = Math.min(minY, raw[i].y);
      maxY = Math.max(maxY, raw[i].y);
    }
    var w = maxX - minX;
    var h = maxY - minY;
    if (w < MIN_SEGMENT_PX || h < MIN_SEGMENT_PX) return { points: raw, leveled: false };
    var targets = [
      { x: minX, y: minY },
      { x: maxX, y: minY },
      { x: maxX, y: maxY },
      { x: minX, y: maxY }
    ];
    var bestRot = 0;
    var bestScore = Infinity;
    var rot;
    for (rot = 0; rot < 4; rot++) {
      var score = 0;
      for (i = 0; i < 4; i++) score += pointDist(raw[i], targets[(i + rot) % 4]);
      if (score < bestScore) {
        bestScore = score;
        bestRot = rot;
      }
    }
    var avgDev = bestScore / 4;
    var devLimit = Math.max(LETTER_WIDTH * 0.025, Math.min(w, h) * RECTIFY_MAX_DEV_RATIO);
    if (avgDev > devLimit) return { points: raw, leveled: false };
    var leveled = [];
    for (i = 0; i < 4; i++) {
      var c = targets[(i + bestRot) % 4];
      leveled.push({ x: Math.round(c.x * 10) / 10, y: Math.round(c.y * 10) / 10 });
    }
    var changed = false;
    for (i = 0; i < 4; i++) {
      if (Math.abs(leveled[i].x - raw[i].x) > 0.5 || Math.abs(leveled[i].y - raw[i].y) > 0.5) {
        changed = true;
        break;
      }
    }
    return { points: leveled, leveled: changed };
  }

  function tryCloseOutlineAt(clamped) {
    if (toolMode !== 'draw') return false;
    if (currentPoints.length < MIN_POLYGON_POINTS || activeDrawMode !== 'outline') return false;
    if (!isNearPoint(clamped, currentPoints[0], CLOSE_SNAP_PX)) return false;
    finishShape();
    return true;
  }

  function tryCloseLineAt(clamped) {
    if (toolMode !== 'line') return false;
    if (currentPoints.length < MIN_POLYGON_POINTS) return false;
    if (!isNearPoint(clamped, currentPoints[0], CLOSE_SNAP_PX)) return false;
    finishLine(true);
    return true;
  }

  function drawClosingCornerHint() {
    if (currentPoints.length < MIN_POLYGON_POINTS) return;
    if (toolMode !== 'draw' && toolMode !== 'line') return;
    if (toolMode === 'draw' && activeDrawMode !== 'outline') return;
    var first = currentPoints[0];
    var nearFirst = cursorPoint && isNearPoint(cursorPoint, first, CLOSE_SNAP_PX * 1.4);
    ctx.beginPath();
    ctx.arc(first.x, first.y, nearFirst ? VERTEX_RADIUS + 8 : VERTEX_RADIUS + 4, 0, Math.PI * 2);
    ctx.fillStyle = nearFirst ? 'rgba(42, 122, 74, 0.35)' : 'rgba(114, 165, 183, 0.25)';
    ctx.fill();
    ctx.lineWidth = nearFirst ? 4 : 3;
    ctx.strokeStyle = nearFirst ? '#2a7a4a' : COLORS.vertex;
    ctx.stroke();
  }

  function drawPanelLabels(labelMap) {
    var panels = getDerivedPanels();
    ctx.save();
    ctx.font = '700 56px Montserrat, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    panels.forEach(function(panel) {
      var num = labelMap[panel.id];
      if (!num) return;
      var text = 'Panel ' + num;
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeText(text, panel.centroid.x, panel.centroid.y);
      ctx.fillStyle = COLORS.stroke;
      ctx.fillText(text, panel.centroid.x, panel.centroid.y);
    });
    ctx.restore();
  }

  function updateUi() {
    var n = currentPoints.length;
    var measuring = toolMode === 'measure';
    if (btnUndo) {
      btnUndo.disabled = measuring
        ? !measureDraft
        : (n === 0 || (toolMode !== 'draw' && toolMode !== 'line'));
    }
    btnFinish.disabled = !(
      (toolMode === 'draw' && activeDrawMode === 'outline' && n >= MIN_POLYGON_POINTS) ||
      (toolMode === 'line' && n >= 2)
    );
    btnUndoShape.disabled = actionHistory.length === 0 && completedShapes.length === 0 && lines.length === 0 && measurements.length === 0 && numberLabels.length === 0 && xMarks.length === 0 && circles.length === 0 && cracks.length === 0 && !crackDraft && !circleDraft;
    if (btnAttach) {
      btnAttach.disabled = !isAttachMode || completedShapes.length === 0 || n > 0 || toolMode === 'move' || toolMode === 'measure' || toolMode === 'number' || toolMode === 'xmark' || toolMode === 'circle' || toolMode === 'crack' || toolMode === 'line' || !!measureDraft || !!numberDrag || !!crackDraft || !!circleDraft;
    }
    if (toolMode === 'move') {
      statusEl.innerHTML = dragState
        ? (dragState.kind === 'circle'
          ? 'Dragging circle — release to place.'
          : 'Dragging — release to place the shape.')
        : 'Drag a circle to move it, or drag a driveway to move the whole panel. Tap <strong>Move shape</strong> again to draw.';
      return;
    }
    if (toolMode === 'line') {
      if (n === 0) {
        statusEl.innerHTML = 'Line mode — tap corners like Draw. No panels are created. Use Measure along these lines.';
      } else if (n < 2) {
        statusEl.innerHTML = '<strong>' + n + '</strong> point — place another to start a line.';
      } else if (n < MIN_POLYGON_POINTS) {
        statusEl.innerHTML = '<strong>' + n + '</strong> points — tap to continue, or tap <strong>Finish</strong> to save the open line.';
      } else {
        statusEl.innerHTML = '<strong>' + n + '</strong> points — tap to continue, tap the <strong>first corner</strong> to close, or <strong>Finish</strong> for an open line.';
      }
      return;
    }
    if (toolMode === 'measure') {
      if (measureDraft) {
        statusEl.innerHTML = 'Tap the other end — snaps <strong>horizontal</strong> or <strong>vertical</strong> only. Then edit the number.';
      } else {
        statusEl.innerHTML = 'Tap to place the first end of a measurement arrow, or tap an existing number to edit it.';
      }
      return;
    }
    if (toolMode === 'number') {
      statusEl.innerHTML = 'Drag a number from the # library onto a panel corner or side midpoint.';
      return;
    }
    if (toolMode === 'xmark') {
      statusEl.innerHTML = 'Tap inside a shape to place an X.';
      return;
    }
    if (toolMode === 'circle') {
      statusEl.innerHTML = circleDraft
        ? 'Drag to size the circle — release to place.'
        : 'Press and drag to mark a pillar or obstruction (perfect circle).';
      return;
    }
    if (toolMode === 'crack') {
      statusEl.innerHTML = crackDraft && crackDraft.length
        ? 'Click to continue crack. Press Enter or tap Crack tool to finish.'
        : 'Click to start crack line.';
      return;
    }
    if (n === 0) {
      if (isAttachMode && completedShapes.length) {
        statusEl.innerHTML = 'Sketch ready — tap <strong>Attach to estimate</strong> to return to the estimator.';
      } else if (isAttachMode) {
        statusEl.innerHTML = 'Draw the outer outline with as many corners as you need, then tap inside to add panel dividers.';
      } else if (hasRootOutline()) {
        statusEl.innerHTML = 'Drag inside a shape to add a divider — lines snap to the shape and can run horizontally, vertically, or diagonally.';
      } else {
        statusEl.innerHTML = '';
      }
    } else if (n < MIN_POLYGON_POINTS) {
      statusEl.innerHTML = '<strong>' + n + '</strong> corner' + (n === 1 ? '' : 's') + ' — place <strong>' + (MIN_POLYGON_POINTS - n) + '</strong> more to close the shape.';
    } else {
      statusEl.innerHTML = '<strong>' + n + '</strong> corners — tap to add another side, or tap the <strong>first corner</strong> (highlighted) to close.';
    }
  }

  function drawGrid(layout) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(layout.contentX, layout.contentY, layout.contentW, layout.contentH);
    ctx.clip();
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1.5;
    var xStart = layout.contentX;
    var yStart = layout.contentY;
    var xEnd = layout.contentX + layout.contentW;
    var yEnd = layout.contentY + layout.contentH;
    for (var x = xStart; x <= xEnd; x += GRID_STEP) {
      ctx.beginPath();
      ctx.moveTo(x + 0.5, yStart);
      ctx.lineTo(x + 0.5, yEnd);
      ctx.stroke();
    }
    for (var y = yStart; y <= yEnd; y += GRID_STEP) {
      ctx.beginPath();
      ctx.moveTo(xStart, y + 0.5);
      ctx.lineTo(xEnd, y + 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawShape(points, closed, previewTo, showVertices) {
    if (!points.length) return;
    if (showVertices === undefined) showVertices = !closed;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (closed && points.length >= 3) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (var i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = COLORS.fill;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (var j = 1; j < points.length; j++) ctx.lineTo(points[j].x, points[j].y);
    if (closed && points.length >= 2) ctx.closePath();
    ctx.strokeStyle = COLORS.stroke;
    ctx.lineWidth = STROKE_WIDTH;
    ctx.stroke();

    if (!closed && previewTo && points.length) {
      var lastPt = points[points.length - 1];
      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(previewTo.x, previewTo.y);
      ctx.setLineDash([18, 12]);
      ctx.strokeStyle = COLORS.preview;
      ctx.lineWidth = STROKE_WIDTH;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (showVertices) {
      points.forEach(function(pt) {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, VERTEX_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = COLORS.vertex;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = COLORS.vertexBorder;
        ctx.stroke();
      });
    }

    ctx.restore();
  }

  function drawLines() {
    if (!lines.length) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = COLORS.stroke;
    ctx.lineWidth = STROKE_WIDTH;
    lines.forEach(function(line) {
      if (!line.points || line.points.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(line.points[0].x, line.points[0].y);
      for (var i = 1; i < line.points.length; i++) {
        ctx.lineTo(line.points[i].x, line.points[i].y);
      }
      if (line.closed && line.points.length >= 2) ctx.closePath();
      ctx.stroke();
    });
    ctx.restore();
  }

  function draw() {
    var layout = getPageLayout(LETTER_WIDTH, LETTER_HEIGHT);
    var panelLabels = getPanelLabelMap();
    ctx.clearRect(0, 0, LETTER_WIDTH, LETTER_HEIGHT);
    drawPageChrome(layout);
    drawGrid(layout);

    ctx.save();
    ctx.beginPath();
    ctx.rect(layout.contentX, layout.contentY, layout.contentW, layout.contentH);
    ctx.clip();

    completedShapes.forEach(function(shape, idx) {
      drawShape(shape.points, shape.closed, null, false);
      ensureShapeDividers(shape);
      shape.dividers.forEach(function(div) {
        normalizeDivider(div);
        drawDividerSegment(div.x1, div.y1, div.x2, div.y2, false);
      });
      if (toolMode === 'move' && selectedShapeIndex === idx) {
        var box = getShapeBBox(shape);
        ctx.save();
        ctx.strokeStyle = 'rgba(114, 165, 183, 0.85)';
        ctx.lineWidth = 4;
        ctx.setLineDash([16, 10]);
        ctx.strokeRect(box.minX - 6, box.minY - 6, box.maxX - box.minX + 12, box.maxY - box.minY + 12);
        ctx.setLineDash([]);
        ctx.restore();
      }
    });

    drawPanelLabels(panelLabels);
    drawLines();
    drawNumberLabels();
    drawXMarks();
    drawCircles();
    drawCracks();

    measurements.forEach(function(m, idx) {
      if (editingMeasureIndex === idx) return;
      drawMeasurementArrow(m, false);
    });

    if (measureDraft && measureCursor) {
      drawMeasurementArrow({
        x1: measureDraft.x,
        y1: measureDraft.y,
        x2: measureCursor.x,
        y2: measureCursor.y,
        axis: measureCursor.axis,
        label: ''
      }, true);
    } else if (measureDraft) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(measureDraft.x, measureDraft.y, VERTEX_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();
      ctx.restore();
    }

    if (dividerPreview) drawDividerSlice(dividerPreview, true);
    drawDividerDragStem();

    if (currentPoints.length && (toolMode === 'line' || (toolMode === 'draw' && activeDrawMode === 'outline'))) {
      drawShape(currentPoints, false, cursorPoint, true);
      drawClosingCornerHint();
    }
    ctx.restore();
  }

  function addLinePoint(x, y) {
    var layout = getPageLayout(LETTER_WIDTH, LETTER_HEIGHT);
    if (!isInContentArea(x, y, layout)) {
      showToast('Draw inside the page area below the header');
      return;
    }
    var clamped = clampToContent(
      Math.round(x * 10) / 10,
      Math.round(y * 10) / 10,
      layout
    );

    if (!currentPoints.length) {
      currentPoints.push(clamped);
      updateUi();
      draw();
      return;
    }

    if (currentPoints.length >= MIN_POLYGON_POINTS && tryCloseLineAt(clamped)) return;

    var anchor = currentPoints[currentPoints.length - 1];
    var snapped = snapPointFromAnchor(anchor, clamped.x, clamped.y);
    if (!snapped) {
      showToast('Move farther from the last corner');
      return;
    }
    currentPoints.push(clampToContent(snapped.x, snapped.y, layout));
    updateUi();
    draw();
  }

  function finishLine(closed) {
    if (currentPoints.length < 2) {
      showToast('Need at least 2 points to finish a line');
      return;
    }
    if (closed && currentPoints.length < MIN_POLYGON_POINTS) {
      showToast('Need at least ' + MIN_POLYGON_POINTS + ' corners to close the line');
      return;
    }
    var pts = currentPoints.map(function(p) { return { x: p.x, y: p.y }; });
    if (closed) {
      var rectified = rectifyOutlinePoints(pts);
      pts = rectified.points;
    }
    lines.push({
      points: pts,
      closed: !!closed
    });
    actionHistory.push({ type: 'line' });
    currentPoints = [];
    cursorPoint = null;
    updateUi();
    draw();
    showToast(closed ? 'Closed line saved — no panels created' : 'Line saved — no panels created');
  }

  function addPoint(x, y) {
    if (toolMode === 'move') return;
    if (toolMode === 'line') {
      addLinePoint(x, y);
      return;
    }
    var layout = getPageLayout(LETTER_WIDTH, LETTER_HEIGHT);
    if (!isInContentArea(x, y, layout)) {
      showToast('Draw inside the page area below the header');
      return;
    }
    var clamped = clampToContent(
      Math.round(x * 10) / 10,
      Math.round(y * 10) / 10,
      layout
    );

    if (!currentPoints.length) {
      activeDrawMode = 'outline';
      dividerTargetIndex = null;
      currentPoints.push(clamped);
      updateUi();
      draw();
      return;
    }

    if (activeDrawMode === 'outline') {
      if (currentPoints.length >= MIN_POLYGON_POINTS && tryCloseOutlineAt(clamped)) return;
      if (findRootContainerAt(clamped.x, clamped.y) !== null) {
        showToast('Drag inside the shape to add dividers — only the outer outline uses corners');
        return;
      }
      var anchor = currentPoints[currentPoints.length - 1];
      var snapped = snapPointFromAnchor(anchor, clamped.x, clamped.y);
      if (!snapped) {
        showToast('Move farther from the last corner');
        return;
      }
      currentPoints.push(clampToContent(snapped.x, snapped.y, layout));
    }

    updateUi();
    draw();
  }

  function handleMovePointerDown(e, p) {
    var circleHit = hitTestCircle(p.x, p.y);
    if (circleHit !== null) {
      selectedShapeIndex = null;
      var circ = circles[circleHit];
      dragState = {
        kind: 'circle',
        circleIndex: circleHit,
        startX: p.x,
        startY: p.y,
        moved: false,
        snapshot: { cx: circ.cx, cy: circ.cy, r: circ.r }
      };
      canvas.style.cursor = 'grabbing';
      draw();
      return;
    }

    var hit = findRootContainerAt(p.x, p.y);
    if (hit === null) {
      selectedShapeIndex = null;
      draw();
      return;
    }
    selectedShapeIndex = hit;
    var shape = completedShapes[hit];
    var shapeSnapshot = cloneShapeGeometry(shape);
    var numberSnapshot = cloneNumberLabels();
    var xMarkSnapshot = cloneXMarks();
    var circleSnapshot = cloneCircles();
    var measurementSnapshot = cloneMeasurements();
    var crackSnapshot = cloneCracks();
    var lineSnapshot = cloneLines();
    var numberMoveIndices = [];
    var xMarkMoveIndices = [];
    var circleMoveIndices = [];
    var measurementMoveIndices = [];
    var crackMoveIndices = [];
    var lineMoveIndices = [];
    var i;
    for (i = 0; i < numberSnapshot.length; i++) {
      if (pointInOrOnPolygon(numberSnapshot[i].x, numberSnapshot[i].y, shapeSnapshot.points)) {
        numberMoveIndices.push(i);
      }
    }
    for (i = 0; i < xMarkSnapshot.length; i++) {
      if (pointInOrOnPolygon(xMarkSnapshot[i].x, xMarkSnapshot[i].y, shapeSnapshot.points)) {
        xMarkMoveIndices.push(i);
      }
    }
    for (i = 0; i < circleSnapshot.length; i++) {
      if (pointInOrOnPolygon(circleSnapshot[i].cx, circleSnapshot[i].cy, shapeSnapshot.points)) {
        circleMoveIndices.push(i);
      }
    }
    for (i = 0; i < measurementSnapshot.length; i++) {
      var mx = (measurementSnapshot[i].x1 + measurementSnapshot[i].x2) / 2;
      var my = (measurementSnapshot[i].y1 + measurementSnapshot[i].y2) / 2;
      if (pointInOrOnPolygon(mx, my, shapeSnapshot.points)) {
        measurementMoveIndices.push(i);
      }
    }
    for (i = 0; i < crackSnapshot.length; i++) {
      var pts = crackSnapshot[i].points || [];
      if (!pts.length) continue;
      var sx = 0, sy = 0;
      for (var cp = 0; cp < pts.length; cp++) {
        sx += pts[cp].x;
        sy += pts[cp].y;
      }
      var cx = sx / pts.length;
      var cy = sy / pts.length;
      if (pointInOrOnPolygon(cx, cy, shapeSnapshot.points)) {
        crackMoveIndices.push(i);
      }
    }
    for (i = 0; i < lineSnapshot.length; i++) {
      var lpts = lineSnapshot[i].points || [];
      if (!lpts.length) continue;
      var lsx = 0, lsy = 0;
      for (var lp = 0; lp < lpts.length; lp++) {
        lsx += lpts[lp].x;
        lsy += lpts[lp].y;
      }
      if (pointInOrOnPolygon(lsx / lpts.length, lsy / lpts.length, shapeSnapshot.points)) {
        lineMoveIndices.push(i);
      }
    }
    dragState = {
      kind: 'shape',
      shapeIndex: hit,
      startX: p.x,
      startY: p.y,
      moved: false,
      snapshot: shapeSnapshot,
      numberSnapshot: numberSnapshot,
      xMarkSnapshot: xMarkSnapshot,
      circleSnapshot: circleSnapshot,
      measurementSnapshot: measurementSnapshot,
      crackSnapshot: crackSnapshot,
      lineSnapshot: lineSnapshot,
      numberMoveIndices: numberMoveIndices,
      xMarkMoveIndices: xMarkMoveIndices,
      circleMoveIndices: circleMoveIndices,
      measurementMoveIndices: measurementMoveIndices,
      crackMoveIndices: crackMoveIndices,
      lineMoveIndices: lineMoveIndices
    };
    canvas.style.cursor = 'grabbing';
    draw();
  }

  function handleMovePointerMove(p) {
    if (!dragState) return;
    var dx = p.x - dragState.startX;
    var dy = p.y - dragState.startY;
    if (!dragState.moved && (dx * dx + dy * dy) < DRAG_THRESHOLD * DRAG_THRESHOLD) return;
    dragState.moved = true;

    if (dragState.kind === 'circle') {
      var layout = getPageLayout(LETTER_WIDTH, LETTER_HEIGHT);
      var circ = circles[dragState.circleIndex];
      if (!circ || !dragState.snapshot) return;
      var next = clampToContent(
        dragState.snapshot.cx + dx,
        dragState.snapshot.cy + dy,
        layout
      );
      circ.cx = Math.round(next.x * 10) / 10;
      circ.cy = Math.round(next.y * 10) / 10;
      draw();
      return;
    }

    var shape = completedShapes[dragState.shapeIndex];
    if (!shape) return;
    shape.points = dragState.snapshot.points.map(function(pt) {
      return { x: pt.x + dx, y: pt.y + dy };
    });
    shape.dividers = dragState.snapshot.dividers.map(function(d) {
      normalizeDivider(d);
      var copy = {
        axis: d.axis,
        angle: d.angle,
        x1: d.x1 + dx,
        y1: d.y1 + dy,
        x2: d.x2 + dx,
        y2: d.y2 + dy
      };
      if (copy.axis === 'v') {
        copy.x = copy.x1;
        copy.y1 = copy.y1;
        copy.y2 = copy.y2;
      } else if (copy.axis === 'h') {
        copy.y = copy.y1;
        copy.x1 = copy.x1;
        copy.x2 = copy.x2;
      }
      return copy;
    });

    // Move any extra marks/annotations that were inside this shape at drag start.
    dragState.numberMoveIndices.forEach(function(idx) {
      var src = dragState.numberSnapshot[idx];
      if (!src || !numberLabels[idx]) return;
      numberLabels[idx].x = src.x + dx;
      numberLabels[idx].y = src.y + dy;
    });
    dragState.xMarkMoveIndices.forEach(function(idx) {
      var src = dragState.xMarkSnapshot[idx];
      if (!src || !xMarks[idx]) return;
      xMarks[idx].x = src.x + dx;
      xMarks[idx].y = src.y + dy;
    });
    dragState.circleMoveIndices.forEach(function(idx) {
      var src = dragState.circleSnapshot[idx];
      if (!src || !circles[idx]) return;
      circles[idx].cx = src.cx + dx;
      circles[idx].cy = src.cy + dy;
    });
    dragState.measurementMoveIndices.forEach(function(idx) {
      var src = dragState.measurementSnapshot[idx];
      if (!src || !measurements[idx]) return;
      measurements[idx].x1 = src.x1 + dx;
      measurements[idx].y1 = src.y1 + dy;
      measurements[idx].x2 = src.x2 + dx;
      measurements[idx].y2 = src.y2 + dy;
    });
    dragState.crackMoveIndices.forEach(function(idx) {
      var src = dragState.crackSnapshot[idx];
      if (!src || !cracks[idx]) return;
      cracks[idx].points = src.points.map(function(p0) {
        return { x: p0.x + dx, y: p0.y + dy };
      });
    });
    dragState.lineMoveIndices.forEach(function(idx) {
      var src = dragState.lineSnapshot[idx];
      if (!src || !lines[idx]) return;
      lines[idx].points = src.points.map(function(p0) {
        return { x: p0.x + dx, y: p0.y + dy };
      });
    });
    draw();
  }

  function handleMovePointerUp() {
    if (!dragState) return;
    canvas.style.cursor = 'grab';
    if (dragState.moved) {
      if (dragState.kind === 'circle') {
        actionHistory.push({
          type: 'circle-move',
          circleIndex: dragState.circleIndex,
          snapshot: dragState.snapshot
        });
        showToast('Circle moved');
      } else {
        var layout = getPageLayout(LETTER_WIDTH, LETTER_HEIGHT);
        clampShapeInContent(dragState.shapeIndex, layout);
        actionHistory.push({
          type: 'move',
          shapeIndex: dragState.shapeIndex,
          snapshot: dragState.snapshot,
          numberSnapshot: dragState.numberSnapshot,
          xMarkSnapshot: dragState.xMarkSnapshot,
          circleSnapshot: dragState.circleSnapshot,
          measurementSnapshot: dragState.measurementSnapshot,
          crackSnapshot: dragState.crackSnapshot,
          lineSnapshot: dragState.lineSnapshot
        });
        showToast('Shape moved');
      }
    }
    dragState = null;
    updateUi();
    draw();
  }

  function undoPoint() {
    if (toolMode === 'measure') {
      if (!measureDraft) return;
      cancelMeasureDraft();
      updateUi();
      draw();
      return;
    }
    if (toolMode === 'crack') {
      if (!crackDraft || !crackDraft.length) return;
      crackDraft.pop();
      if (!crackDraft.length) cancelCrackDraft();
      updateUi();
      draw();
      return;
    }
    if (toolMode !== 'draw' && toolMode !== 'line') return;
    if (!currentPoints.length) return;
    currentPoints.pop();
    if (!currentPoints.length) {
      activeDrawMode = 'outline';
      dividerTargetIndex = null;
    }
    updateUi();
    draw();
  }

  function finishShape() {
    if (toolMode === 'line') {
      finishLine(false);
      return;
    }
    if (currentPoints.length < MIN_POLYGON_POINTS) {
      showToast('Need at least ' + MIN_POLYGON_POINTS + ' corners to close the shape');
      return;
    }
    var rectified = rectifyOutlinePoints(currentPoints);
    completedShapes.push({
      points: rectified.points,
      closed: true,
      dividers: []
    });
    actionHistory.push({ type: 'shape' });
    currentPoints = [];
    cursorPoint = null;
    activeDrawMode = 'outline';
    dividerTargetIndex = null;
    updateUi();
    draw();
    if (rectified.leveled) {
      showToast('Outline leveled — drag inside to add panel dividers');
    } else {
      showToast('Outer outline saved — drag inside to add panel dividers');
    }
  }

  function undoShape() {
    if (!actionHistory.length) return;
    var action = actionHistory.pop();
    if (action.type === 'divider') {
      var divShape = completedShapes[action.shapeIndex];
      if (divShape && divShape.dividers && divShape.dividers.length) divShape.dividers.pop();
    } else if (action.type === 'shape') {
      completedShapes.pop();
      selectedShapeIndex = null;
    } else if (action.type === 'line') {
      lines.pop();
    } else if (action.type === 'measure') {
      measurements.pop();
      closeMeasureEditor(false);
    } else if (action.type === 'number-label') {
      numberLabels.pop();
    } else if (action.type === 'xmark') {
      xMarks.pop();
    } else if (action.type === 'circle') {
      circles.pop();
    } else if (action.type === 'circle-move') {
      var movedCircle = circles[action.circleIndex];
      if (movedCircle && action.snapshot) {
        movedCircle.cx = action.snapshot.cx;
        movedCircle.cy = action.snapshot.cy;
        movedCircle.r = action.snapshot.r;
      }
    } else if (action.type === 'crack') {
      cracks.pop();
    } else if (action.type === 'move') {
      var moved = completedShapes[action.shapeIndex];
      if (moved && action.snapshot) {
        moved.points = action.snapshot.points.map(function(p) { return { x: p.x, y: p.y }; });
        moved.dividers = action.snapshot.dividers.map(function(d) {
          normalizeDivider(d);
          var copy = {
            axis: d.axis,
            angle: d.angle,
            x1: d.x1,
            y1: d.y1,
            x2: d.x2,
            y2: d.y2
          };
          if (copy.axis === 'v') {
            copy.x = d.x;
            copy.y1 = d.y1;
            copy.y2 = d.y2;
          } else if (copy.axis === 'h') {
            copy.y = d.y;
            copy.x1 = d.x1;
            copy.x2 = d.x2;
          }
          return copy;
        });
      }
      if (action.numberSnapshot) {
        numberLabels = action.numberSnapshot.map(function(n) {
          return { id: n.id, value: n.value, x: n.x, y: n.y };
        });
      }
      if (action.xMarkSnapshot) {
        xMarks = action.xMarkSnapshot.map(function(m) {
          return { x: m.x, y: m.y };
        });
      }
      if (action.circleSnapshot) {
        circles = action.circleSnapshot.map(function(c) {
          return { cx: c.cx, cy: c.cy, r: c.r };
        });
      }
      if (action.measurementSnapshot) {
        measurements = action.measurementSnapshot.map(function(m) {
          return {
            id: m.id,
            x1: m.x1, y1: m.y1,
            x2: m.x2, y2: m.y2,
            axis: m.axis,
            label: m.label
          };
        });
      }
      if (action.crackSnapshot) {
        cracks = action.crackSnapshot.map(function(c) {
          return {
            points: c.points.map(function(p) { return { x: p.x, y: p.y }; })
          };
        });
      }
      if (action.lineSnapshot) {
        lines = action.lineSnapshot.map(function(line) {
          return {
            closed: !!line.closed,
            points: line.points.map(function(p) { return { x: p.x, y: p.y }; })
          };
        });
      }
    }
    updateUi();
    draw();
  }

  function clearAll() {
    if (!completedShapes.length && !lines.length && !currentPoints.length && !measurements.length && !numberLabels.length && !xMarks.length && !circles.length && !cracks.length && !measureDraft && !crackDraft && !circleDraft) return;
    if (!confirm('Clear the entire sketch?')) return;
    completedShapes = [];
    lines = [];
    measurements = [];
    numberLabels = [];
    xMarks = [];
    circles = [];
    cracks = [];
    stopNumberDrag();
    closeMeasureEditor(false);
    cancelCrackDraft();
    cancelCircleDraft();
    cancelCurrentDrawing();
    toolMode = 'draw';
    selectedShapeIndex = null;
    dragState = null;
    dividerDrag = null;
    actionHistory = [];
    syncToolButtons();
    updateUi();
    draw();
  }

  function captureExportImage(forJpg) {
    var exportCanvas = document.createElement('canvas');
    exportCanvas.width = LETTER_WIDTH;
    exportCanvas.height = LETTER_HEIGHT;
    var ectx = exportCanvas.getContext('2d');
    ectx.imageSmoothingEnabled = true;
    ectx.imageSmoothingQuality = 'high';
    ectx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, LETTER_WIDTH, LETTER_HEIGHT);

    try {
      return { dataUrl: exportCanvas.toDataURL('image/jpeg', JPEG_QUALITY), width: LETTER_WIDTH, height: LETTER_HEIGHT };
    } catch (e1) {
      try {
        return { dataUrl: exportCanvas.toDataURL('image/png'), width: LETTER_WIDTH, height: LETTER_HEIGHT, isPng: true };
      } catch (e2) {
        throw new Error('Sketch is too large to export — try clearing and redrawing');
      }
    }
  }

  function buildJpegBlob(exportImage) {
    if (exportImage.isPng) {
      throw new Error('Could not create JPG — try finishing fewer shapes');
    }
    return new Blob([dataUrlToBytes(exportImage.dataUrl)], { type: 'image/jpeg' });
  }

  function dataUrlToBytes(dataUrl) {
    var comma = dataUrl.indexOf(',');
    if (comma < 0) throw new Error('Invalid image data');
    var base64 = dataUrl.slice(comma + 1);
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function isMobileDevice() {
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function isIOSDevice() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function revokePendingSaveUrl() {
    if (pendingSaveUrl) {
      URL.revokeObjectURL(pendingSaveUrl);
      pendingSaveUrl = null;
    }
  }

  function closeSaveOverlay() {
    if (saveOverlay) saveOverlay.style.display = 'none';
    revokePendingSaveUrl();
    pendingSaveBlob = null;
    pendingSaveFilename = '';
  }

  function triggerDirectDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
  }

  function showSaveOverlay(blob, filename) {
    revokePendingSaveUrl();
    pendingSaveBlob = blob;
    pendingSaveFilename = filename;
    pendingSaveUrl = URL.createObjectURL(blob);
    if (savePreview) savePreview.src = pendingSaveUrl;
    if (saveInstructions) {
      saveInstructions.innerHTML = isIOSDevice()
        ? 'Press and hold the image below, then tap <strong>Save to Photos</strong> or <strong>Add to Photos</strong>.'
        : 'Image saved — also available below. Press and hold to save, or tap <strong>Download again</strong>.';
    }
    if (saveOverlay) saveOverlay.style.display = 'flex';
  }

  function saveJpgToDevice(blob, filename) {
    if (window.showSaveFilePicker) {
      return window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'JPEG image', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } }]
      }).then(function(handle) {
        return handle.createWritable();
      }).then(function(writable) {
        return writable.write(blob).then(function() { return writable.close(); });
      }).then(function() {
        showToast('JPG saved to your chosen folder');
      }).catch(function(err) {
        if (err && err.name === 'AbortError') return;
        return saveJpgToDeviceFallback(blob, filename);
      });
    }
    return saveJpgToDeviceFallback(blob, filename);
  }

  function saveJpgToDeviceFallback(blob, filename) {
    triggerDirectDownload(blob, filename);

    if (isIOSDevice()) {
      showSaveOverlay(blob, filename);
      showToast('Press and hold the image to save to Photos');
      return Promise.resolve();
    }

    if (isMobileDevice()) {
      showSaveOverlay(blob, filename);
      showToast('Saved — check Downloads, or use the preview below');
      return Promise.resolve();
    }

    showToast('JPG saved to Downloads');
    return Promise.resolve();
  }

  function shareJpgFile(blob, filename) {
    var file = new File([blob], filename, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({
        files: [file],
        title: 'Ro-Berg Site Sketch'
      }).then(function() {
        showToast('Shared');
      }).catch(function(err) {
        if (err && err.name === 'AbortError') return;
        showToast('Could not share — use Save JPG instead');
      });
    }
    showToast('Sharing is not available here — use Save JPG');
    return Promise.resolve();
  }

  function prepareExportCanvas() {
    var savedPoints = currentPoints;
    var savedCursor = cursorPoint;
    var savedPreview = dividerPreview;
    var savedMode = activeDrawMode;
    var savedTarget = dividerTargetIndex;
    var savedTool = toolMode;
    var savedDrag = dragState;
    var savedDividerDrag = dividerDrag;
    var savedSelected = selectedShapeIndex;
    var savedMeasureDraft = measureDraft;
    var savedMeasureCursor = measureCursor;
    var savedEditing = editingMeasureIndex;
    closeMeasureEditor(true);
    cancelCurrentDrawing();
    cancelCircleDraft();
    toolMode = 'draw';
    dragState = null;
    selectedShapeIndex = null;
    draw();
    return function restore() {
      currentPoints = savedPoints;
      cursorPoint = savedCursor;
      dividerPreview = savedPreview;
      activeDrawMode = savedMode;
      dividerTargetIndex = savedTarget;
      toolMode = savedTool;
      dragState = savedDrag;
      dividerDrag = savedDividerDrag;
      selectedShapeIndex = savedSelected;
      measureDraft = savedMeasureDraft;
      measureCursor = savedMeasureCursor;
      editingMeasureIndex = savedEditing;
      syncToolButtons();
      draw();
    };
  }

  function buildJpgExport() {
    if (!completedShapes.length) {
      showToast('Draw at least one finished shape first');
      return null;
    }
    closeAddressEditor(true);
    var restore = prepareExportCanvas();
    try {
      var exportImage = captureExportImage(true);
      var blob = buildJpegBlob(exportImage);
      return { blob: blob, filename: buildSketchFilename() };
    } catch (err) {
      showToast(err.message || 'Could not create JPG — try again');
      return null;
    } finally {
      restore();
    }
  }

  function exportJpg() {
    btnExportJpg.disabled = true;
    var result = buildJpgExport();
    if (result) {
      saveJpgToDevice(result.blob, result.filename).catch(function(err) {
        showToast((err && err.message) ? err.message : 'Could not save JPG — try again');
      });
    }
    btnExportJpg.disabled = false;
  }

  function shareJpg() {
    btnShareJpg.disabled = true;
    var result = buildJpgExport();
    if (result) {
      shareJpgFile(result.blob, result.filename);
    }
    btnShareJpg.disabled = false;
  }

  function approxDataUrlBytes(dataUrl) {
    var comma = dataUrl.indexOf(',');
    if (comma < 0) return 0;
    var b64 = dataUrl.slice(comma + 1);
    var padding = (b64.indexOf('=') >= 0) ? b64.length - b64.indexOf('=') : 0;
    return Math.floor(b64.length * 0.75) - padding;
  }

  function downscaleDataUrlForAttach(dataUrl) {
    return new Promise(function(resolve, reject) {
      var img = new Image();
      img.onload = function() {
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var scale = Math.min(1, ATTACH_MAX_DIM / Math.max(w, h));
        var tw = Math.max(1, Math.round(w * scale));
        var th = Math.max(1, Math.round(h * scale));
        var c = document.createElement('canvas');
        c.width = tw;
        c.height = th;
        c.getContext('2d').drawImage(img, 0, 0, tw, th);
        resolve(c.toDataURL('image/jpeg', ATTACH_JPEG_QUALITY));
      };
      img.onerror = function() { reject(new Error('Could not prepare sketch')); };
      img.src = dataUrl;
    });
  }

  function attachToEstimate() {
    if (!isAttachMode || !attachCtx) {
      showToast('Open the sketch from the estimator to attach');
      return;
    }
    if (!completedShapes.length) {
      showToast('Draw at least one finished shape first');
      return;
    }
    if (currentPoints.length) {
      showToast('Finish or cancel the current shape first');
      return;
    }
    if (toolMode === 'move' || toolMode === 'crack' || toolMode === 'circle' || dragState || crackDraft || circleDraft) {
      showToast('Finish crack/move/circle mode before attaching');
      return;
    }
    closeAddressEditor(true);
    btnAttach.disabled = true;
    var restore = prepareExportCanvas();
    var exportImage;
    try {
      exportImage = captureExportImage(true);
    } catch (err) {
      restore();
      btnAttach.disabled = false;
      showToast(err.message || 'Could not export sketch');
      return;
    }
    restore();

    downscaleDataUrlForAttach(exportImage.dataUrl).then(function(dataUrl) {
      var fileName = buildSketchFilename();
      try {
        sessionStorage.setItem(PENDING_ATTACH_KEY, JSON.stringify({
          optionId: attachCtx.optionId,
          optionName: attachCtx.optionName,
          dataUrl: dataUrl,
          fileName: fileName,
          sizeBytes: approxDataUrlBytes(dataUrl)
        }));
      } catch (e) {
        showToast('Sketch too large — use Save JPG and add manually');
        btnAttach.disabled = false;
        return;
      }
      window.location.href = attachCtx.returnTo || 'calculator-v2.html';
    }).catch(function(err) {
      btnAttach.disabled = false;
      showToast((err && err.message) ? err.message : 'Could not attach sketch');
    });
  }

  canvas.addEventListener('pointerdown', function(e) {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    canvas.setPointerCapture(e.pointerId);
    var p = getPointerPos(e);
    var layout = getPageLayout(LETTER_WIDTH, LETTER_HEIGHT);
    var clamped = clampToContent(p.x, p.y, layout);

    if (hitTestAddressHeader(p.x, p.y, layout)) {
      openAddressEditor();
      e.preventDefault();
      return;
    }
    if (editingAddress) closeAddressEditor(true);

    if (toolMode === 'move') {
      handleMovePointerDown(e, p);
      e.preventDefault();
      return;
    }
    if (toolMode === 'crack') {
      if (!isInContentArea(clamped.x, clamped.y, layout)) {
        showToast('Draw inside the page area below the header');
        e.preventDefault();
        return;
      }
      if (!crackDraft) {
        crackDraft = [{ x: Math.round(clamped.x * 10) / 10, y: Math.round(clamped.y * 10) / 10 }];
      } else {
        crackDraft.push({ x: Math.round(clamped.x * 10) / 10, y: Math.round(clamped.y * 10) / 10 });
      }
      crackCursor = null;
      updateUi();
      draw();
      e.preventDefault();
      return;
    }
    if (toolMode === 'xmark') {
      var shapeIdx = findRootContainerAt(clamped.x, clamped.y);
      if (shapeIdx === null) {
        showToast('Place X inside a shape');
        e.preventDefault();
        return;
      }
      xMarks.push({
        x: Math.round(clamped.x * 10) / 10,
        y: Math.round(clamped.y * 10) / 10
      });
      actionHistory.push({ type: 'xmark' });
      draw();
      e.preventDefault();
      return;
    }
    if (toolMode === 'circle') {
      if (!isInContentArea(clamped.x, clamped.y, layout)) {
        showToast('Draw inside the page area below the header');
        e.preventDefault();
        return;
      }
      circleDraft = {
        cx: Math.round(clamped.x * 10) / 10,
        cy: Math.round(clamped.y * 10) / 10,
        r: 0
      };
      updateUi();
      draw();
      e.preventDefault();
      return;
    }

    if (toolMode === 'measure') {
      if (editingMeasureIndex !== null) closeMeasureEditor(true);
      var hitLabel = hitTestMeasurementLabel(clamped.x, clamped.y);
      if (hitLabel !== null && !measureDraft) {
        openMeasureEditor(hitLabel);
        e.preventDefault();
        return;
      }
      if (!isInContentArea(clamped.x, clamped.y, layout)) {
        showToast('Draw inside the page area below the header');
        e.preventDefault();
        return;
      }
      if (!measureDraft) {
        var startSnap = snapPointToLines(clamped.x, clamped.y);
        measureDraft = { x: startSnap.x, y: startSnap.y };
        measureCursor = null;
        updateUi();
        draw();
      } else {
        var endSnap = snapPointToLines(clamped.x, clamped.y);
        var end = resolveMeasureEnd(measureDraft, endSnap.x, endSnap.y);
        commitMeasure(end);
      }
      e.preventDefault();
      return;
    }
    if (toolMode === 'number') {
      if (!selectedNumberValue) {
        showToast('Select a number from the # library first');
        e.preventDefault();
        return;
      }
      if (!placeNumberValueAtCanvasPoint(selectedNumberValue, clamped)) {
        showToast('Place numbers near a crack, panel corner, or panel side midpoint');
        e.preventDefault();
        return;
      }
      draw();
      e.preventDefault();
      return;
    }
    if (toolMode === 'line') {
      addLinePoint(p.x, p.y);
      e.preventDefault();
      return;
    }

    // Allow editing existing measurement labels without leaving draw mode.
    if (!currentPoints.length && !dividerDrag) {
      var editHit = hitTestMeasurementLabel(clamped.x, clamped.y);
      if (editHit !== null) {
        openMeasureEditor(editHit);
        e.preventDefault();
        return;
      }
    }

    if (currentPoints.length) {
      addPoint(p.x, p.y);
    } else {
      var containerIdx = findRootContainerAt(clamped.x, clamped.y);
      if (containerIdx !== null) {
        startDividerDrag(containerIdx, clamped.x, clamped.y);
      } else {
        addPoint(p.x, p.y);
      }
    }
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', function(e) {
    var layout = getPageLayout(LETTER_WIDTH, LETTER_HEIGHT);
    var raw = getPointerPos(e);
    var p = clampToContent(raw.x, raw.y, layout);

    if (toolMode === 'move') {
      handleMovePointerMove(p);
      return;
    }

    if (toolMode === 'measure') {
      if (measureDraft) {
        var moveSnap = snapPointToLines(p.x, p.y);
        measureCursor = resolveMeasureEnd(measureDraft, moveSnap.x, moveSnap.y);
        draw();
      }
      return;
    }
    if (toolMode === 'circle') {
      if (circleDraft) {
        var dx = p.x - circleDraft.cx;
        var dy = p.y - circleDraft.cy;
        circleDraft.r = Math.sqrt(dx * dx + dy * dy);
        draw();
      }
      return;
    }
    if (toolMode === 'crack') {
      if (crackDraft && crackDraft.length) {
        crackCursor = { x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 };
        draw();
      }
      return;
    }

    if (dividerDrag) {
      updateDividerDrag(p);
      draw();
      return;
    }

    if (currentPoints.length && (toolMode === 'line' || (toolMode === 'draw' && activeDrawMode === 'outline'))) {
      cursorPoint = resolveDrawPoint(raw.x, raw.y);
      draw();
      return;
    }

    dividerPreview = null;
    cursorPoint = null;
    draw();
  });

  canvas.addEventListener('pointerleave', function() {
    cursorPoint = null;
    if (toolMode === 'crack') {
      crackCursor = null;
      draw();
      return;
    }
    if (toolMode === 'measure') {
      if (!measureDraft) measureCursor = null;
      draw();
      return;
    }
    if (dividerDrag) cancelDividerDrag();
    else dividerPreview = null;
    if (toolMode === 'move' && dragState) return;
    draw();
  });

  canvas.addEventListener('pointerup', function(e) {
    if (toolMode === 'move') {
      handleMovePointerUp();
    } else if (toolMode === 'circle' && circleDraft) {
      if (commitCircleDraft()) {
        showToast('Circle placed');
      } else {
        showToast('Drag farther to size the circle');
      }
      updateUi();
      draw();
    } else if (dividerDrag) {
      commitDividerDrag();
    }
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });

  document.addEventListener('pointermove', function(e) {
    if (!numberDrag) return;
    updateDragChip(e.clientX, e.clientY, numberDrag.value, true);
  });

  document.addEventListener('pointerup', function(e) {
    if (!numberDrag) return;
    var rect = canvas.getBoundingClientRect();
    var inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
    if (inside) {
      var p = {
        x: (e.clientX - rect.left) * (LETTER_WIDTH / rect.width),
        y: (e.clientY - rect.top) * (LETTER_HEIGHT / rect.height)
      };
      if (placeNumberAtCanvasPoint(p)) {
        draw();
      } else {
        showToast('Drop near a crack, panel corner, or side midpoint');
      }
    }
    stopNumberDrag();
    updateUi();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
        if (e.target === measureInput) {
          e.preventDefault();
          closeMeasureEditor(true);
        }
        return;
      }
      e.preventDefault();
      if (toolMode === 'crack') {
        if (commitCrackDraft()) {
          updateUi();
          draw();
          showToast('Crack saved');
        } else {
          updateUi();
          draw();
        }
        return;
      }
      if (toolMode === 'line') {
        if (currentPoints.length >= 2) finishLine(false);
        return;
      }
      if (currentPoints.length >= MIN_POLYGON_POINTS) {
        finishShape();
      }
    } else if (e.key === 'Backspace' || e.key === 'Delete') {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      e.preventDefault();
      undoPoint();
    } else if (e.key === 'Escape') {
      if (editingMeasureIndex !== null) {
        closeMeasureEditor(false);
        showToast('Edit cancelled');
      } else if (dividerDrag) {
        cancelDividerDrag();
        draw();
        showToast('Divider cancelled');
      } else if (measureDraft) {
        cancelMeasureDraft();
        updateUi();
        draw();
        showToast('Measurement cancelled');
      } else if (circleDraft) {
        cancelCircleDraft();
        updateUi();
        draw();
        showToast('Circle cancelled');
      } else if (crackDraft && crackDraft.length) {
        cancelCrackDraft();
        updateUi();
        draw();
        showToast('Crack cancelled');
      } else if (currentPoints.length) {
        cancelCurrentDrawing();
        updateUi();
        draw();
        showToast('Cancelled');
      } else if (toolMode === 'move' || toolMode === 'measure' || toolMode === 'number' || toolMode === 'xmark' || toolMode === 'circle' || toolMode === 'line') {
        var was = toolMode;
        setToolMode('draw');
        if (was === 'move') showToast('Move mode off');
        else if (was === 'measure') showToast('Measure mode off');
        else if (was === 'number') showToast('Number mode off');
        else if (was === 'circle') showToast('Circle mode off');
        else if (was === 'line') showToast('Line mode off');
        else showToast('X mode off');
      }
    }
  });

  btnFinish.addEventListener('click', finishShape);
  btnUndoShape.addEventListener('click', undoShape);
  btnClear.addEventListener('click', clearAll);
  if (btnDraw) {
    btnDraw.addEventListener('click', function() {
      if (toolMode === 'crack' && crackDraft && crackDraft.length) {
        commitCrackDraft();
      }
      setToolMode('draw');
      showToast('Draw mode — tap corners to outline');
    });
  }
  if (btnLine) {
    btnLine.addEventListener('click', function() {
      if (toolMode === 'line') {
        cancelCurrentDrawing();
        setToolMode('draw');
        showToast('Draw mode — tap corners to outline');
      } else {
        setToolMode('line');
        showToast('Line mode — draw without creating panels');
      }
    });
  }
  if (btnMove) {
    btnMove.addEventListener('click', function() {
      setToolMode(toolMode === 'move' ? 'draw' : 'move');
      if (toolMode === 'move') showToast('Move mode — drag a circle or a driveway');
    });
  }
  if (btnMeasure) {
    btnMeasure.addEventListener('click', function() {
      setToolMode(toolMode === 'measure' ? 'draw' : 'measure');
      if (toolMode === 'measure') showToast('Measure mode — tap two ends for an arrow');
    });
  }
  if (btnXmark) {
    btnXmark.addEventListener('click', function() {
      setToolMode(toolMode === 'xmark' ? 'draw' : 'xmark');
      if (toolMode === 'xmark') showToast('X mode — tap inside a shape');
    });
  }
  if (btnCircle) {
    btnCircle.addEventListener('click', function() {
      setToolMode(toolMode === 'circle' ? 'draw' : 'circle');
      if (toolMode === 'circle') showToast('Circle mode — press and drag to size');
    });
  }
  if (btnCrack) {
    btnCrack.addEventListener('click', function() {
      if (toolMode === 'crack') {
        if (commitCrackDraft()) {
          setToolMode('draw');
          showToast('Crack saved');
        } else {
          setToolMode('draw');
          showToast('Crack mode off');
        }
        updateUi();
        draw();
        return;
      }
      setToolMode('crack');
      showToast('Crack mode — click to add segments, Enter to finish');
    });
  }
  if (btnNumber) {
    btnNumber.addEventListener('click', function() {
      setToolMode(toolMode === 'number' ? 'draw' : 'number');
      if (toolMode === 'number') showToast('Number mode — drag values from # library');
    });
  }
  if (numberGridEl) {
    numberGridEl.addEventListener('click', function(e) {
      var btn = e.target && e.target.closest ? e.target.closest('.rb-number-item') : null;
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-num-idx'), 10);
      if (!Number.isFinite(idx) || idx < 0 || idx >= numberPalette.length) return;
      setSelectedNumber(numberPalette[idx]);
    });
    numberGridEl.addEventListener('pointerdown', function(e) {
      var btn = e.target && e.target.closest ? e.target.closest('.rb-number-item') : null;
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-num-idx'), 10);
      if (!Number.isFinite(idx) || idx < 0 || idx >= numberPalette.length) return;
      var value = numberPalette[idx];
      setSelectedNumber(value);
      startNumberDrag(e.clientX, e.clientY, value);
      if (toolMode !== 'number') setToolMode('number');
      e.preventDefault();
    });
  }
  if (numberCustomBtn) {
    numberCustomBtn.addEventListener('click', function() {
      var val = sanitizeNumberValue(numberCustomInput ? numberCustomInput.value : '');
      if (!val) return;
      numberPalette.push(val);
      setSelectedNumber(val);
      renderNumberPalette();
      if (numberCustomInput) numberCustomInput.select();
      if (toolMode !== 'number') setToolMode('number');
      showToast('Custom value added to library');
    });
  }
  if (numberCustomInput) {
    numberCustomInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (numberCustomBtn) numberCustomBtn.click();
      }
    });
  }
  if (measureInput) {
    measureInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        closeMeasureEditor(true);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeMeasureEditor(false);
      }
    });
    measureInput.addEventListener('blur', function() {
      if (editingMeasureIndex !== null) closeMeasureEditor(true);
    });
  }
  if (addressInput) {
    addressInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        closeAddressEditor(true);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeAddressEditor(false);
      }
    });
    addressInput.addEventListener('blur', function() {
      if (editingAddress) closeAddressEditor(true);
    });
  }
  btnExportJpg.addEventListener('click', exportJpg);
  btnShareJpg.addEventListener('click', shareJpg);
  if (btnAttach) btnAttach.addEventListener('click', attachToEstimate);
  saveCloseBtn.addEventListener('click', closeSaveOverlay);
  saveOverlay.addEventListener('click', function(e) {
    if (e.target === saveOverlay) closeSaveOverlay();
  });
  saveDownloadBtn.addEventListener('click', function() {
    if (!pendingSaveBlob || !pendingSaveFilename) return;
    triggerDirectDownload(pendingSaveBlob, pendingSaveFilename);
    showToast('Download started again');
  });
  saveShareBtn.addEventListener('click', function() {
    if (!pendingSaveBlob || !pendingSaveFilename) return;
    shareJpgFile(pendingSaveBlob, pendingSaveFilename);
  });

  window.addEventListener('resize', resizeCanvas);
  renderNumberPalette();
  setSelectedNumber(numberPalette[0] || '0');
  initAttachMode();
  resizeCanvas();
  updateUi();
})();
</script>
</body>
</html>
