    var closed = pointDist(smoothed[0], smoothed[smoothed.length - 1]) < Math.max(CLOSE_SNAP_PX, totalLen * 0.04);
    var corners = findSharpCornerIndices(smoothed, { preferManyCorners: preferManyCorners || !closed });

    // Few corners detected: tighter pass — critical for multi-sided sidewalk freehand.
    if (corners.length < (closed ? 4 : 5)) {
      var alt = [];
      var span2 = Math.max(2, Math.floor(smoothed.length / (preferManyCorners ? 36 : 30)));
      var scores2 = [];
      var i2;
      for (i2 = 0; i2 < smoothed.length; i2++) scores2[i2] = 0;
      for (i2 = span2; i2 < smoothed.length - span2; i2++) {
        scores2[i2] = strokeTurnAngle(smoothed[i2 - span2], smoothed[i2], smoothed[i2 + span2]);
      }
      var thresh2 = (preferManyCorners || !closed ? 22 : 28) * Math.PI / 180;
      for (i2 = span2; i2 < smoothed.length - span2; i2++) {
        if (scores2[i2] < thresh2) continue;
        var localMax = true;
        for (var j2 = i2 - span2; j2 <= i2 + span2; j2++) {
          if (j2 !== i2 && scores2[j2] > scores2[i2]) localMax = false;
        }
        if (localMax) alt.push(i2);
      }
      var minAlt = closed ? 3 : 2;
      if (alt.length >= minAlt) {
        corners = [0].concat(alt).concat([smoothed.length - 1]);
      }
    }

    var result = [];
    var s;
    for (s = 0; s < corners.length - 1; s++) {
      var seg = smoothed.slice(corners[s], corners[s + 1] + 1);
      if (seg.length < 2) continue;
      var piece;
      if (isMostlyStraight(seg)) {
        piece = snapNearAxis(seg[0], seg[seg.length - 1]);
      } else {
        piece = fitSmoothCurveSegment(seg);
      }
      if (!result.length) result = piece.slice();
      else result = result.concat(piece.slice(1));
    }

    // No useful corners → single smooth curve (sidewalk arc), never a bad polygon fit.
    if (corners.length <= 2) {
      result = fitSmoothCurveSegment(smoothed);
    }

    if (closed && result.length >= 3) {
      result[result.length - 1] = { x: result[0].x, y: result[0].y };
    }

    if (result.length < 2) {
      return [
        { x: Math.round(smoothed[0].x * 10) / 10, y: Math.round(smoothed[0].y * 10) / 10 },
        { x: Math.round(smoothed[smoothed.length - 1].x * 10) / 10, y: Math.round(smoothed[smoothed.length - 1].y * 10) / 10 }
      ];
    }

    return result.map(function(p) {
      return { x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 };
    });
  }

  function appendInkPoint(x, y) {
    if (!inkDraft || !inkDraft.length) {
      inkDraft = [{ x: x, y: y }];
      return true;
    }
    var last = inkDraft[inkDraft.length - 1];
    var dx = x - last.x;
    var dy = y - last.y;
    if ((dx * dx + dy * dy) < INK_MIN_SAMPLE_PX * INK_MIN_SAMPLE_PX) return false;
    inkDraft.push({ x: x, y: y });
    return true;
  }

  function commitInkDraft() {
    if (!inkDraft || inkDraft.length < 2) {
      cancelInkDraft();
      return false;
    }
    var beautified = beautifyInkStroke(inkDraft);
    cancelInkDraft();
    if (!beautified || beautified.length < 2) return false;
    lines.push({
      points: beautified,
      closed: false
    });
    actionHistory.push({ type: 'line' });
    return true;
  }

  // --- ODD PANEL TRIAL begin ---
  var oddStartHit = null;

  function cancelOddDraft() {
    oddDraft = null;
    oddDragging = false;
    oddStartHit = null;
  }

  function appendOddPoint(x, y) {
    if (!oddDraft || !oddDraft.length) {
      oddDraft = [{ x: x, y: y }];
      return true;
    }
    var last = oddDraft[oddDraft.length - 1];
    var dx = x - last.x;
    var dy = y - last.y;
    if ((dx * dx + dy * dy) < INK_MIN_SAMPLE_PX * INK_MIN_SAMPLE_PX) return false;
    oddDraft.push({ x: x, y: y });
    return true;
  }

  function collectBorderPaths() {
    var paths = [];
    var i;
    for (i = 0; i < lines.length; i++) {
      if (!lines[i].points || lines[i].points.length < 2) continue;
      paths.push({
        id: 'line:' + i,
        points: lines[i].points,
        closed: !!lines[i].closed
      });
    }
    for (i = 0; i < completedShapes.length; i++) {
      var shape = completedShapes[i];
      if (!shape.points || shape.points.length < 2) continue;
      paths.push({
        id: 'shape:' + i,
        points: shape.points,
        closed: true
      });
      ensureShapeDividers(shape);
      var di;
      for (di = 0; di < shape.dividers.length; di++) {
        var div = shape.dividers[di];
        normalizeDivider(div);
        if (div.x1 == null || div.y1 == null || div.x2 == null || div.y2 == null) continue;
        paths.push({
          id: 'div:' + i + ':' + di,
          points: [
            { x: div.x1, y: div.y1 },
            { x: div.x2, y: div.y2 }
          ],
          closed: false
        });
      }
    }
    // Each derived panel ring — includes outer sides and inside divider sides.
    var panels = getDerivedPanels();
    for (i = 0; i < panels.length; i++) {
      var poly = panels[i].polygon;
      if (!poly || poly.length < 3) continue;
      paths.push({
        id: 'panel:' + panels[i].id,
        points: poly.map(function(p) { return { x: p.x, y: p.y }; }),
        closed: true
      });
    }
    return paths;
  }

  function oddSnapThreshold() {
    // Generous "tiny bit off" latch onto nearby lines / panel sides / dividers.
    return Math.max(CLOSE_SNAP_PX * 3.5, MIN_SEGMENT_PX * 3.2, LETTER_WIDTH * 0.028);
  }

  // Walk closed/open border from fromHit → toHit both directions.
  // Returns { short, long } chains (each begins with from, ends with to).
  function walkBorderChainsBoth(path, fromHit, toHit) {
    if (!path || !path.points || path.points.length < 2 || !fromHit || !toHit) return null;
    var pts = path.points;
    var closed = !!path.closed;
    var n = pts.length;
    var segCount = closed ? n : n - 1;

    function clone(p) { return { x: p.x, y: p.y }; }

    if (fromHit.segIndex === toHit.segIndex) {
      var direct = [clone(fromHit), clone(toHit)];
      if (!closed) return { short: direct, long: direct };
      // Opposite way goes the long way around the ring through every vertex.
      var around = [clone(fromHit)];
      var seg = fromHit.segIndex;
      var steps = 0;
      var nextSeg = closed ? (seg + 1) % n : seg + 1;
      while (steps++ <= segCount + 2) {
        var endIdx = (seg + 1) % n;
        around.push(clone(pts[endIdx]));
        if (nextSeg === toHit.segIndex && steps > 0) {
          // Completed full loop except we need the long path when same segment:
          // build full ring start→… back not including short.
          break;
        }
        seg = nextSeg;
        nextSeg = closed ? (seg + 1) % n : seg + 1;
      }
      // Prefer simple: short = direct; long = go around opposite vertex order.
      var longSame = [clone(fromHit)];
      var prev = fromHit.segIndex;
      steps = 0;
      while (steps++ <= segCount + 2) {
        var prevSeg = closed ? (prev - 1 + n) % n : prev - 1;
        if (prevSeg < 0) break;
        longSame.push(clone(pts[prev]));
        if (prevSeg === toHit.segIndex) {
          longSame.push(clone(toHit));
          break;
        }
        prev = prevSeg;
      }
      if (longSame.length >= 2 && longSame[longSame.length - 1]) {
        return { short: direct, long: longSame.length > 2 ? longSame : direct };
      }
      return { short: direct, long: direct };
    }

    function buildChain(forward) {
      var chain = [clone(fromHit)];
      var seg = fromHit.segIndex;
      var steps = 0;
      while (steps++ <= segCount + 1) {
        if (forward) {
          var endIdx = (seg + 1) % n;
          if (!closed && seg + 1 >= n) return null;
          var nextSeg = closed ? (seg + 1) % n : seg + 1;
          if (nextSeg === toHit.segIndex) {
            chain.push(clone(pts[endIdx]));
            chain.push(clone(toHit));
            return chain;
          }
          if (!closed && nextSeg >= segCount) return null;
          chain.push(clone(pts[endIdx]));
          seg = nextSeg;
        } else {
          var startIdx = seg;
          var prevSeg = closed ? (seg - 1 + n) % n : seg - 1;
          if (!closed && prevSeg < 0) return null;
          if (prevSeg === toHit.segIndex) {
            chain.push(clone(pts[startIdx]));
            chain.push(clone(toHit));
            return chain;
          }
          chain.push(clone(pts[startIdx]));
          seg = prevSeg;
        }
      }
      return null;
    }

    function chainLen(c) {
      if (!c || c.length < 2) return Infinity;
      var len = 0;
      var i;
      for (i = 1; i < c.length; i++) len += pointDist(c[i - 1], c[i]);
      return len;
    }

    var a = buildChain(true);
    var b = buildChain(false);
    if (!a && !b) return null;
    if (!a) return { short: b, long: b };
    if (!b) return { short: a, long: a };
    var la = chainLen(a);
    var lb = chainLen(b);
    return la <= lb
      ? { short: a, long: b }
      : { short: b, long: a };
  }

  // Walk along one border path from fromHit → toHit (shorter way if closed).
  function walkBorderBetween(path, fromHit, toHit) {
    var both = walkBorderChainsBoth(path, fromHit, toHit);
    return both ? both.short : null;
  }

  function rootShapeIndexFromPathId(pathId) {
    if (!pathId) return null;
    var m;
    if (pathId.indexOf('shape:') === 0) {
      return parseInt(pathId.slice(6), 10);
    }
    if (pathId.indexOf('panel:') === 0) {
      // panel:{shapeIndex}:{ri...}
      var rest = pathId.slice(6);
      var colon = rest.indexOf(':');
      if (colon < 0) return null;
      return parseInt(rest.slice(0, colon), 10);
    }
    if (pathId.indexOf('div:') === 0) {
      m = pathId.split(':');
      return m.length >= 2 ? parseInt(m[1], 10) : null;
    }
    return null;
  }

  function hitOnRootOutline(shapeIndex, x, y, maxDist) {
    var shape = completedShapes[shapeIndex];
    if (!shape || !shape.points || shape.points.length < 3) return null;
    var path = { id: 'shape:' + shapeIndex, points: shape.points, closed: true };
    var proj = projectPointOntoPath(path, x, y);
    if (!proj || proj.dist > maxDist) return null;
    return hitFromProjection(path, proj, -1);
  }

  function snapToNearestRootOutline(x, y, maxDist) {
    var best = null;
    var bestIdx = null;
    var i;
    for (i = 0; i < completedShapes.length; i++) {
      if (!isRootShape(i)) continue;
      var hit = hitOnRootOutline(i, x, y, maxDist);
      if (!hit) continue;
      if (!best || hit.dist < best.dist) {
        best = hit;
        bestIdx = i;
      }
    }
    if (!best) return null;
    best.shapeIndex = bestIdx;
    best.pathId = 'shape:' + bestIdx;
    best.snapped = true;
    return best;
  }

  // Expand root outline with an exterior stroke A→B, and return the new
  // outline plus the attachment (neck) endpoints for a panel divider.
  function expandRootOutlineWithStroke(shapeIndex, freehand) {
    var shape = completedShapes[shapeIndex];
    if (!shape || !shape.closed || !freehand || freehand.length < 2) return null;
    var outline = shape.points;
    if (outline.length < 3) return null;

    var maxDist = oddSnapThreshold();
    var a = freehand[0];
    var b = freehand[freehand.length - 1];
    var startHit = hitOnRootOutline(shapeIndex, a.x, a.y, maxDist);
    var endHit = hitOnRootOutline(shapeIndex, b.x, b.y, maxDist);
    if (!startHit || !endHit) return null;

    if (pointDist(startHit, endHit) < MIN_SEGMENT_PX * 0.5) return null;

    var free = freehand.map(function(p) { return { x: p.x, y: p.y }; });
    free[0] = { x: startHit.x, y: startHit.y };
    free[free.length - 1] = { x: endHit.x, y: endHit.y };

    // Exterior path should mostly stay outside (multi-side sidewalks can graze the wall).
    var outsideOrEdge = 0;
    var samples = 0;
    var si;
    for (si = 1; si < free.length - 1; si++) {
      samples++;
      var pt = free[si];
      if (!pointInPolygon(pt.x, pt.y, outline) ||
          pointToPolygonBoundaryDist(pt.x, pt.y, outline) <= MIN_SEGMENT_PX * 0.85) {
        outsideOrEdge++;
      }
    }
    if (samples > 0 && outsideOrEdge < Math.max(1, Math.ceil(samples * 0.4))) {
      return null;
    }

    var path = { id: 'shape:' + shapeIndex, points: outline, closed: true };
    // Chains from end B → start A along outline.
    var chains = walkBorderChainsBoth(path, endHit, startHit);
    if (!chains || !chains.short || !chains.long) return null;

    function buildExpanded(hostBA) {
      if (!hostBA || hostBA.length < 2) return null;
      var poly = free.slice();
      var i;
      for (i = 1; i < hostBA.length; i++) {
        poly.push({ x: hostBA[i].x, y: hostBA[i].y });
      }
      if (poly.length >= 2 && pointDist(poly[0], poly[poly.length - 1]) < 0.75) {
        poly.pop();
      }
      if (poly.length < MIN_POLYGON_POINTS) return null;
      return poly;
    }

    var hostArea = polygonArea(outline);
    var candLong = buildExpanded(chains.long);
    var candShort = buildExpanded(chains.short);
    var best = null;
    var bestArea = hostArea;

    function consider(cand) {
      if (!cand) return;
      var ar = polygonArea(cand);
      if (ar > bestArea + MIN_SEGMENT_PX * MIN_SEGMENT_PX * 0.25) {
        bestArea = ar;
        best = cand;
      }
    }
    // Prefer long host walk (replace short neck wall with freehand on exterior).
    consider(candLong);
    consider(candShort);
    if (!best) return null;

    return {
      points: best.map(function(p) {
        return { x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 };
      }),
      startHit: { x: startHit.x, y: startHit.y },
      endHit: { x: endHit.x, y: endHit.y }
    };
  }

  // Build the neck divider that turns the exterior lobe into its own labeled panel.
  function attachmentDividerFromHits(startHit, endHit) {
    var angle = Math.atan2(endHit.y - startHit.y, endHit.x - startHit.x);
    var snapped = snapDividerAngle(angle);
    return chordToStoredDivider({
      axis: angleToDividerAxis(snapped),
      angle: snapped,
      x1: startHit.x,
      y1: startHit.y,
      x2: endHit.x,
      y2: endHit.y
    });
  }

  function applyOutlineExpansion(shapeIndex, freehand) {
    var shape = completedShapes[shapeIndex];
    if (!shape) return false;
    var result = expandRootOutlineWithStroke(shapeIndex, freehand);
    if (!result || !result.points) return false;
    var snapshot = cloneShapeGeometry(shape);
    shape.points = result.points;
    ensureShapeDividers(shape);

    // Always place a divider on the attachment neck so the new exterior lobe is
    // a separate labeled panel (like 8 / 10 / 11), still in the same outline.
    var neck = attachmentDividerFromHits(result.startHit, result.endHit);
    if (neck && chordLength(neck) >= MIN_SEGMENT_PX * 0.5) {
      var conflict = false;
      var di;
      for (di = 0; di < shape.dividers.length; di++) {
        if (dividersConflict(shape.dividers[di], neck)) {
          conflict = true;
          break;
        }
      }
      if (!conflict) {
        shape.dividers.push(neck);
      }
    }

    actionHistory.push({
      type: 'outline-expand',
      shapeIndex: shapeIndex,
      snapshot: snapshot
    });
    return true;
  }

  function projectPointOntoPath(path, x, y) {
    if (!path || !path.points || path.points.length < 2) return null;
    var pts = path.points;
    var segCount = path.closed ? pts.length : pts.length - 1;
    var best = null;
    var s;
    for (s = 0; s < segCount; s++) {
      var a = pts[s];
      var b = pts[(s + 1) % pts.length];
      var proj = projectPointToSegment(x, y, a.x, a.y, b.x, b.y);
      if (!best || proj.dist < best.dist) {
        best = {
          x: proj.x,
          y: proj.y,
          dist: proj.dist,
          t: proj.t,
          segIndex: s,
          closed: !!path.closed,
          pathId: path.id
        };
      }
    }
    return best;
  }

  function snapPointToBorder(x, y) {
    var paths = collectBorderPaths();
    if (!paths.length) return { x: x, y: y, snapped: false };
    var threshold = oddSnapThreshold();
    var best = null;
    var bestPathIndex = -1;
    var pi;
    for (pi = 0; pi < paths.length; pi++) {
      var hit = projectPointOntoPath(paths[pi], x, y);
      if (!hit) continue;
      if (!best || hit.dist < best.dist) {
        best = hit;
        bestPathIndex = pi;
      }
    }
    if (!best || best.dist > threshold || bestPathIndex < 0) {
      return { x: x, y: y, snapped: false };
    }
    return {
      x: Math.round(best.x * 10) / 10,
      y: Math.round(best.y * 10) / 10,
      dist: best.dist,
      t: best.t,
      pathIndex: bestPathIndex,
      pathId: best.pathId,
      segIndex: best.segIndex,
      closed: best.closed,
      snapped: true
    };
  }

  function borderChainLength(chain) {
    if (!chain || chain.length < 2) return Infinity;
    var len = 0;
    var i;
    for (i = 1; i < chain.length; i++) len += pointDist(chain[i - 1], chain[i]);
    return len;
  }

  function hitFromProjection(path, proj, pathIndex) {
    return {
      x: Math.round(proj.x * 10) / 10,
      y: Math.round(proj.y * 10) / 10,
      dist: proj.dist,
      t: proj.t,
      pathIndex: pathIndex,
      pathId: path.id,
      segIndex: proj.segIndex,
      closed: !!path.closed,
      snapped: true
    };
  }

  // If start/end both lie on the same panel ring, close along that ring
  // (short corner), even when snap landed on separate divider path ids.
  function walkSharedPanelBorder(fromHit, toHit) {
    var threshold = oddSnapThreshold();
    var panels = getDerivedPanels();
    var best = null;
    var bestLen = Infinity;
    var i;
    for (i = 0; i < panels.length; i++) {
      var poly = panels[i].polygon;
      if (!poly || poly.length < 3) continue;
      var path = {
        id: 'panel:' + panels[i].id,
        points: poly,
        closed: true
      };
      var a = projectPointOntoPath(path, fromHit.x, fromHit.y);
      var b = projectPointOntoPath(path, toHit.x, toHit.y);
      if (!a || !b || a.dist > threshold || b.dist > threshold) continue;
      var fromOn = hitFromProjection(path, a, -1);
      var toOn = hitFromProjection(path, b, -1);
      var chain = walkBorderBetween(path, fromOn, toOn);
      var len = borderChainLength(chain);
      if (chain && chain.length >= 2 && len < bestLen) {
        best = chain;
        bestLen = len;
      }
    }
    return best;
  }

  // Prefer snapping start/end onto any borders; close along one path or the
  // connected network when start and end are on different lines.
  function resolveOddAttachment(startX, startY, endX, endY) {
    var startHit = snapPointToBorder(startX, startY);
    var endHit = snapPointToBorder(endX, endY);
    if (!startHit.snapped || !endHit.snapped) return null;

    var paths = collectBorderPaths();
    var path = null;
    var pi;
    for (pi = 0; pi < paths.length; pi++) {
      if (paths[pi].id === startHit.pathId) {
        path = paths[pi];
        startHit.pathIndex = pi;
        break;
      }
    }

    var candidates = [];
    if (startHit.pathId === endHit.pathId && path) {
      // Re-project end onto the same path for consistent seg indices.
      var eOnPath = projectPointOntoPath(path, endX, endY);
      if (eOnPath && eOnPath.dist <= oddSnapThreshold()) {
        endHit = hitFromProjection(path, eOnPath, startHit.pathIndex);
        var same = walkBorderBetween(path, endHit, startHit);
        if (same && same.length >= 2) candidates.push(same);
      }
    }

    var shared = walkSharedPanelBorder(endHit, startHit);
    if (shared && shared.length >= 2) candidates.push(shared);

    var networked = walkBorderNetwork(endHit, startHit);
    if (networked && networked.length >= 2) candidates.push(networked);

    var border = null;
    var bestLen = Infinity;
    var c;
    for (c = 0; c < candidates.length; c++) {
      var len = borderChainLength(candidates[c]);
      if (len < bestLen) {
        bestLen = len;
        border = candidates[c];
      }
    }
    if (!border || border.length < 2) return null;

    return {
      startHit: startHit,
      endHit: endHit,
      path: path,
      border: border
    };
  }

  function walkBorderNetwork(fromHit, toHit) {
    if (!fromHit || !toHit) return null;
    var JOIN = Math.max(12, LETTER_WIDTH * 0.0045);
    var nodeList = []; // { x, y }
    var adj = []; // adj[i] = [{ j, w }]

    function findOrAddNode(x, y) {
      var i;
      for (i = 0; i < nodeList.length; i++) {
        if (pointDist(nodeList[i], { x: x, y: y }) <= JOIN) return i;
      }
      nodeList.push({ x: x, y: y });
      adj.push([]);
      return nodeList.length - 1;
    }

    function addEdge(i, j, w) {
      if (i === j || !(w >= 0)) return;
      adj[i].push({ j: j, w: w });
      adj[j].push({ j: i, w: w });
    }

    function segT(ax, ay, bx, by, x, y) {
      var abx = bx - ax;
      var aby = by - ay;
      var len2 = abx * abx + aby * aby;
      if (len2 < 1e-8) return 0;
      return ((x - ax) * abx + (y - ay) * aby) / len2;
    }

    var paths = collectBorderPaths();
    var segs = [];
    var p;
    for (p = 0; p < paths.length; p++) {
      var pts = paths[p].points;
      if (!pts || pts.length < 2) continue;
      var segCount = paths[p].closed ? pts.length : pts.length - 1;
      var s;
      for (s = 0; s < segCount; s++) {
        var a = pts[s];
        var b = pts[(s + 1) % pts.length];
        segs.push({
          ax: a.x, ay: a.y, bx: b.x, by: b.y,
          pathId: paths[p].id,
          segIndex: s
        });
      }
    }

    // Split each segment at crossings (e.g. H/V divider intersection) and hits.
    var splits = [];
    var si;
    for (si = 0; si < segs.length; si++) splits.push([0, 1]);

    function addSplit(segIndex, t) {
      if (t < -0.001 || t > 1.001) return;
      splits[segIndex].push(Math.max(0, Math.min(1, t)));
    }

    for (si = 0; si < segs.length; si++) {
      var s1 = segs[si];
      var sj;
      for (sj = si + 1; sj < segs.length; sj++) {
        var s2 = segs[sj];
        var cross = segmentIntersection(
          s1.ax, s1.ay, s1.bx, s1.by,
          s2.ax, s2.ay, s2.bx, s2.by
        );
        if (!cross) continue;
        addSplit(si, segT(s1.ax, s1.ay, s1.bx, s1.by, cross.x, cross.y));
        addSplit(sj, segT(s2.ax, s2.ay, s2.bx, s2.by, cross.x, cross.y));
      }
    }

    function addHitSplits(hit) {
      for (si = 0; si < segs.length; si++) {
        if (segs[si].pathId !== hit.pathId || segs[si].segIndex !== hit.segIndex) continue;
        addSplit(si, segT(segs[si].ax, segs[si].ay, segs[si].bx, segs[si].by, hit.x, hit.y));
      }
    }
    addHitSplits(fromHit);
    addHitSplits(toHit);

    for (si = 0; si < segs.length; si++) {
      var ts = splits[si].slice().sort(function(u, v) { return u - v; });
      var uniq = [];
      var ti;
      for (ti = 0; ti < ts.length; ti++) {
        if (!uniq.length || Math.abs(ts[ti] - uniq[uniq.length - 1]) > 1e-4) {
          uniq.push(ts[ti]);
        }
      }
      var seg = segs[si];
      for (ti = 0; ti < uniq.length - 1; ti++) {
        var t0 = uniq[ti];
        var t1 = uniq[ti + 1];
        var x0 = seg.ax + (seg.bx - seg.ax) * t0;
        var y0 = seg.ay + (seg.by - seg.ay) * t0;
        var x1 = seg.ax + (seg.bx - seg.ax) * t1;
        var y1 = seg.ay + (seg.by - seg.ay) * t1;
        var ia = findOrAddNode(x0, y0);
        var ib = findOrAddNode(x1, y1);
        addEdge(ia, ib, Math.hypot(x1 - x0, y1 - y0));
      }
    }

    var iFrom = findOrAddNode(fromHit.x, fromHit.y);
    var iTo = findOrAddNode(toHit.x, toHit.y);
    if (fromHit.pathId === toHit.pathId && fromHit.segIndex === toHit.segIndex) {
      addEdge(iFrom, iTo, pointDist(fromHit, toHit));
    }

    // Dijkstra
    var N = nodeList.length;
    var dist = [];
    var prev = [];
    var used = [];
    var i;
    for (i = 0; i < N; i++) {
      dist[i] = Infinity;
      prev[i] = -1;
      used[i] = false;
    }
    dist[iFrom] = 0;
    for (var iter = 0; iter < N; iter++) {
      var u = -1;
      var best = Infinity;
      for (i = 0; i < N; i++) {
        if (!used[i] && dist[i] < best) {
          best = dist[i];
          u = i;
        }
      }
      if (u < 0 || best === Infinity) break;
      used[u] = true;
      if (u === iTo) break;
      var e;
      for (e = 0; e < adj[u].length; e++) {
        var v = adj[u][e].j;
        var w = adj[u][e].w;
        if (dist[u] + w < dist[v]) {
          dist[v] = dist[u] + w;
          prev[v] = u;
        }
      }
    }
    if (prev[iTo] < 0 && iTo !== iFrom) return null;

    var chainIdx = [];
    for (i = iTo; i >= 0; i = prev[i]) {
      chainIdx.push(i);
      if (i === iFrom) break;
    }
    chainIdx.reverse();
    if (chainIdx[0] !== iFrom) return null;

    return chainIdx.map(function(idx) {
      return { x: nodeList[idx].x, y: nodeList[idx].y };
    });
  }

  function buildOddPanelFromStroke(rawPts, startHit, endHit, border) {
    if (!rawPts || rawPts.length < 2 || !startHit || !endHit || !border) return null;
    if (!startHit.snapped || !endHit.snapped) return null;
    if (border.length < 2) return null;

    var freehand = beautifyInkStroke(rawPts);
    if (!freehand || freehand.length < 2) return null;
    freehand[0] = { x: startHit.x, y: startHit.y };
    freehand[freehand.length - 1] = { x: endHit.x, y: endHit.y };

    // Close along border chain: end → … → start (border already oriented that way).
    var poly = freehand.slice();
    var b;
    for (b = 1; b < border.length - 1; b++) {
      poly.push({ x: border[b].x, y: border[b].y });
    }
    if (poly.length < MIN_POLYGON_POINTS) return null;
    if (Math.abs(polygonArea(poly)) < MIN_SEGMENT_PX * MIN_SEGMENT_PX) return null;
    return poly;
  }

  function commitOddPanelDraft() {
    if (!oddDraft || oddDraft.length < 3 || !oddStartHit || !oddStartHit.snapped) {
      cancelOddDraft();
      return false;
    }
    var last = oddDraft[oddDraft.length - 1];
    var attachment = resolveOddAttachment(
      oddStartHit.x, oddStartHit.y,
      last.x, last.y
    );
    var raw = oddDraft.map(function(p) { return { x: p.x, y: p.y }; });
    cancelOddDraft();
    if (!attachment) return false;

    // Freehand exterior run A→B — keep multi-corner sidewalk / freeform shapes.
    var freehand = beautifyInkStroke(raw, { preferManyCorners: true });
    if (!freehand || freehand.length < 2) return false;
    freehand[0] = { x: attachment.startHit.x, y: attachment.startHit.y };
    freehand[freehand.length - 1] = { x: attachment.endHit.x, y: attachment.endHit.y };

    // Always expand into a root host + neck divider (own labeled panel, same shape).
    // Never create a nested overlay shape for exterior attaches.
    var hostIdx = rootShapeIndexFromPathId(attachment.startHit.pathId);
    var hostIdx2 = rootShapeIndexFromPathId(attachment.endHit.pathId);

    if (hostIdx != null && hostIdx === hostIdx2 && isRootShape(hostIdx)) {
      if (applyOutlineExpansion(hostIdx, freehand)) return true;
    }
    if (hostIdx != null && isRootShape(hostIdx) && applyOutlineExpansion(hostIdx, freehand)) {
      return true;
    }
    if (hostIdx2 != null && hostIdx2 !== hostIdx && isRootShape(hostIdx2) &&
        applyOutlineExpansion(hostIdx2, freehand)) {
      return true;
    }

    // Last resort: try every root outline near the hits.
    var hi;
    for (hi = 0; hi < completedShapes.length; hi++) {
      if (!isRootShape(hi)) continue;
      if (applyOutlineExpansion(hi, freehand)) return true;
    }
    return false;
  }

  function drawOddDraft() {
    if (!oddDraft || !oddDraft.length) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(oddDraft[0].x, oddDraft[0].y);
    for (var i = 1; i < oddDraft.length; i++) {
      ctx.lineTo(oddDraft[i].x, oddDraft[i].y);
    }
    ctx.strokeStyle = COLORS.stroke;
    ctx.lineWidth = STROKE_WIDTH;
    ctx.stroke();

    if (oddStartHit && oddStartHit.snapped && oddDraft.length >= 2) {
      var tip = oddDraft[oddDraft.length - 1];
      var attachment = resolveOddAttachment(
        oddStartHit.x, oddStartHit.y,
        tip.x, tip.y
      );
      if (attachment && attachment.border && attachment.border.length >= 2) {
        var border = attachment.border;
        ctx.globalAlpha = 0.85;
        ctx.setLineDash([16, 12]);
        ctx.strokeStyle = 'rgba(114, 165, 183, 0.95)';
        ctx.beginPath();
        ctx.moveTo(border[0].x, border[0].y);
        for (var b = 1; b < border.length; b++) {
          ctx.lineTo(border[b].x, border[b].y);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.globalAlpha = 0.22;
        ctx.beginPath();
        ctx.moveTo(oddDraft[0].x, oddDraft[0].y);
        for (var j = 1; j < oddDraft.length; j++) {
          ctx.lineTo(oddDraft[j].x, oddDraft[j].y);
        }
        for (var k = 1; k < border.length; k++) {
          ctx.lineTo(border[k].x, border[k].y);
        }
        ctx.closePath();
        ctx.fillStyle = COLORS.fill;
        ctx.fill();

        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(attachment.endHit.x, attachment.endHit.y, VERTEX_RADIUS + 2, 0, Math.PI * 2);
        ctx.fillStyle = COLORS.vertex;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = COLORS.vertexBorder;
        ctx.stroke();
      }
    }

    if (oddStartHit && oddStartHit.snapped) {
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(oddStartHit.x, oddStartHit.y, VERTEX_RADIUS + 2, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.vertex;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = COLORS.vertexBorder;
      ctx.stroke();
    }
    ctx.restore();
  }
  // --- ODD PANEL TRIAL end ---

  function drawCrackPath(points, previewEnd) {
    if (!points || !points.length) return;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    if (previewEnd) ctx.lineTo(previewEnd.x, previewEnd.y);
    ctx.stroke();
  }

  function drawCracks() {
    if (!cracks.length && !crackDraft) return;
    ctx.save();
    ctx.strokeStyle = '#d02222';
    ctx.lineWidth = CRACK_STROKE_WIDTH;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    cracks.forEach(function(c) { drawCrackPath(c.points, null); });
    if (crackDraft && crackDraft.length) drawCrackPath(crackDraft, crackCursor);
    ctx.restore();
  }

  function cancelCrackDraft() {
    crackDraft = null;
    crackCursor = null;
    crackDragging = false;
  }

  function commitCrackDraft() {
    if (!crackDraft || crackDraft.length < 2) {
      cancelCrackDraft();
      return false;
    }
    cracks.push({
      points: crackDraft.map(function(p) { return { x: p.x, y: p.y }; })
    });
    actionHistory.push({ type: 'crack' });
    cancelCrackDraft();
    return true;
  }

  function translateShape(shape, dx, dy) {
    shape.points.forEach(function(p) {
      p.x += dx;
      p.y += dy;
    });
    ensureShapeDividers(shape);
    shape.dividers.forEach(function(d) {
      normalizeDivider(d);
      d.x1 += dx;
      d.y1 += dy;
      d.x2 += dx;
      d.y2 += dy;
      if (d.axis === 'v') {
        d.x = d.x1;
        d.y1 = d.y1;
        d.y2 = d.y2;
      } else if (d.axis === 'h') {
        d.y = d.y1;
        d.x1 = d.x1;
        d.x2 = d.x2;
      }
    });
  }

  function getShapeBBox(shape) {
    var minX = Infinity;
    var minY = Infinity;
    var maxX = -Infinity;
    var maxY = -Infinity;
    shape.points.forEach(function(p) {
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x);
      maxY = Math.max(maxY, p.y);
    });
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
  }

  function clampShapeInContent(shapeIndex, layout) {
    var shape = completedShapes[shapeIndex];
    if (!shape) return;
    var box = getShapeBBox(shape);
    var dx = 0;
    var dy = 0;
    if (box.minX < layout.contentX) dx = layout.contentX - box.minX;
    else if (box.maxX > layout.contentX + layout.contentW) {
      dx = layout.contentX + layout.contentW - box.maxX;
    }
    if (box.minY < layout.contentY) dy = layout.contentY - box.minY;
    else if (box.maxY > layout.contentY + layout.contentH) {
      dy = layout.contentY + layout.contentH - box.maxY;
    }
    if (dx || dy) translateShape(shape, dx, dy);
  }

  function cancelCurrentDrawing() {
    currentPoints = [];
    cursorPoint = null;
    dividerPreview = null;
    activeDrawMode = 'outline';
    dividerTargetIndex = null;
    dividerDrag = null;
    outlineAttach = null;
    measureDraft = null;
    measureCursor = null;
  }

  function cancelMeasureDraft() {
    measureDraft = null;
    measureCursor = null;
  }

  function projectPointToSegment(px, py, ax, ay, bx, by) {
    var abx = bx - ax;
    var aby = by - ay;
    var len2 = abx * abx + aby * aby;
    if (len2 < 0.0001) {
      return { x: ax, y: ay, dist: Math.hypot(px - ax, py - ay), t: 0 };
    }
    var t = ((px - ax) * abx + (py - ay) * aby) / len2;
    t = Math.max(0, Math.min(1, t));
    var x = ax + t * abx;
    var y = ay + t * aby;
    return { x: x, y: y, dist: Math.hypot(px - x, py - y), t: t };
  }

  function snapPointToLines(x, y) {
    if (!lines.length) return { x: x, y: y, snapped: false };
    var best = null;
    var threshold = Math.max(CLOSE_SNAP_PX, MIN_SEGMENT_PX * 0.75);
    for (var i = 0; i < lines.length; i++) {
      var pts = lines[i].points || [];
      if (pts.length < 2) continue;
      var segCount = lines[i].closed ? pts.length : pts.length - 1;
      for (var s = 0; s < segCount; s++) {
        var a = pts[s];
        var b = pts[(s + 1) % pts.length];
        var proj = projectPointToSegment(x, y, a.x, a.y, b.x, b.y);
        if (!best || proj.dist < best.dist) best = proj;
      }
    }
    if (!best || best.dist > threshold) return { x: x, y: y, snapped: false };
    return {
      x: Math.round(best.x * 10) / 10,
      y: Math.round(best.y * 10) / 10,
      snapped: true
    };
  }

  function resolveMeasureEnd(start, x, y) {
    var dx = x - start.x;
    var dy = y - start.y;
    var absDx = Math.abs(dx);
    var absDy = Math.abs(dy);
    if (absDx < 0.001 && absDy < 0.001) {
      return { x: start.x, y: start.y, axis: 'h', length: 0 };
    }
    // Horizontal or vertical only — pick the dominant drag axis.
    if (absDx >= absDy) {
      return {
        x: Math.round(x * 10) / 10,
        y: start.y,
        axis: 'h',
        length: absDx
      };
    }
    return {
      x: start.x,
      y: Math.round(y * 10) / 10,
      axis: 'v',
      length: absDy
    };
  }

  function measureLabelText(m) {
    if (m && m.label != null && String(m.label).trim() !== '') return String(m.label).trim();
    return '?';
  }

  function getMeasurementGeometry(m) {
    var label = measureLabelText(m);
    ctx.save();
    ctx.font = '700 ' + MEASURE_FONT_SIZE + 'px Montserrat, sans-serif';
    var textW = ctx.measureText(label).width;
    ctx.restore();
    var gapW = textW + MEASURE_TEXT_PAD_X * 2;
    var gapH = MEASURE_FONT_SIZE + MEASURE_TEXT_PAD_Y * 2;
    var x1 = m.x1;
    var y1 = m.y1;
    var x2 = m.x2;
    var y2 = m.y2;
    return {
      x1: x1,
      y1: y1,
      x2: x2,
      y2: y2,
      axis: m.axis,
      mx: (x1 + x2) / 2,
      my: (y1 + y2) / 2,
      label: label,
      gapW: gapW,
      gapH: gapH
    };
  }

  function drawArrowHead(tipX, tipY, fromX, fromY) {
    var angle = Math.atan2(tipY - fromY, tipX - fromX);
    var size = MEASURE_ARROW_SIZE;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(
      tipX - size * Math.cos(angle - Math.PI / 6),
      tipY - size * Math.sin(angle - Math.PI / 6)
    );
    ctx.lineTo(
      tipX - size * Math.cos(angle + Math.PI / 6),
      tipY - size * Math.sin(angle + Math.PI / 6)
    );
    ctx.closePath();
    ctx.fill();
  }

  function drawMeasurementArrow(m, isPreview) {
    var g = getMeasurementGeometry(m);
    ctx.save();
    ctx.strokeStyle = '#000000';
    ctx.fillStyle = '#000000';
    ctx.lineWidth = MEASURE_STROKE;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';
    if (isPreview) ctx.globalAlpha = 0.55;

    if (g.axis === 'h') {
      var y = g.y1;
      var left = Math.min(g.x1, g.x2);
      var right = Math.max(g.x1, g.x2);
      var gapLeft = g.mx - g.gapW / 2;
      var gapRight = g.mx + g.gapW / 2;
      if (gapLeft > left + 2) {
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(gapLeft, y);
        ctx.stroke();
        drawArrowHead(left, y, gapLeft, y);
      }
      if (right > gapRight + 2) {
        ctx.beginPath();
        ctx.moveTo(gapRight, y);
        ctx.lineTo(right, y);
        ctx.stroke();
        drawArrowHead(right, y, gapRight, y);
      }
    } else {
      var x = g.x1;
      var top = Math.min(g.y1, g.y2);
      var bottom = Math.max(g.y1, g.y2);
      var gapTop = g.my - g.gapH / 2;
      var gapBottom = g.my + g.gapH / 2;
      if (gapTop > top + 2) {
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, gapTop);
        ctx.stroke();
        drawArrowHead(x, top, x, gapTop);
      }
      if (bottom > gapBottom + 2) {
        ctx.beginPath();
        ctx.moveTo(x, gapBottom);
        ctx.lineTo(x, bottom);
        ctx.stroke();
        drawArrowHead(x, bottom, x, gapBottom);
      }
    }

    ctx.globalAlpha = isPreview ? 0.7 : 1;
    ctx.font = '700 ' + MEASURE_FONT_SIZE + 'px Montserrat, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000000';
    ctx.fillText(g.label, g.mx, g.my);
    ctx.restore();
  }

  function hitTestMeasurementLabel(x, y) {
    for (var i = measurements.length - 1; i >= 0; i--) {
      if (editingMeasureIndex === i) continue;
      var g = getMeasurementGeometry(measurements[i]);
      var hw = Math.max(g.gapW, 60) / 2;
      var hh = Math.max(g.gapH, 40) / 2;
      if (x >= g.mx - hw && x <= g.mx + hw && y >= g.my - hh && y <= g.my + hh) {
        return i;
      }
    }
    return null;
  }

  function closeMeasureEditor(commit) {
    if (editingMeasureIndex === null) return;
    var idx = editingMeasureIndex;
    var m = measurements[idx];
    if (commit && m && measureInput) {
      m.label = String(measureInput.value || '').trim();
    }
    editingMeasureIndex = null;
    if (measureInput) {
      measureInput.style.display = 'none';
      measureInput.blur();
    }
    draw();
  }

  function openMeasureEditor(index) {
    if (!measureInput || index == null || !measurements[index]) return;
    closeAddressEditor(true);
    closeMeasureEditor(true);
    editingMeasureIndex = index;
    var m = measurements[index];
    var g = getMeasurementGeometry(m);
    var canvasRect = canvas.getBoundingClientRect();
    var wrap = canvas.parentElement;
    var wrapRect = wrap.getBoundingClientRect();
    var cssX = (g.mx / LETTER_WIDTH) * displayCssW;
    var cssY = (g.my / LETTER_HEIGHT) * displayCssH;
    var left = (canvasRect.left - wrapRect.left) + cssX;
    var top = (canvasRect.top - wrapRect.top) + cssY;
    measureInput.style.display = 'block';
    measureInput.style.left = left + 'px';
    measureInput.style.top = top + 'px';
    measureInput.value = m.label || '';
    draw();
    setTimeout(function() {
      try {
        measureInput.focus();
        measureInput.select();
      } catch (_) {}
    }, 30);
  }

  function commitMeasure(end) {
    if (!measureDraft || !end) {
      cancelMeasureDraft();
      return;
    }
    if (end.length < MIN_SEGMENT_PX) {
      showToast('Drag farther to place the measurement');
      cancelMeasureDraft();
      updateUi();
      draw();
      return;
    }
    var layout = getPageLayout(LETTER_WIDTH, LETTER_HEIGHT);
    var p1 = clampToContent(measureDraft.x, measureDraft.y, layout);
    var p2 = clampToContent(end.x, end.y, layout);
    var resolved = resolveMeasureEnd(p1, p2.x, p2.y);
    if (resolved.length < MIN_SEGMENT_PX) {
      showToast('Measurement too short');
      cancelMeasureDraft();
      updateUi();
      draw();
      return;
    }
    var entry = {
      id: nextMeasureId++,
      x1: p1.x,
      y1: p1.y,
      x2: resolved.x,
      y2: resolved.y,
      axis: resolved.axis,
      label: ''
    };
    measurements.push(entry);
    actionHistory.push({ type: 'measure' });
    cancelMeasureDraft();
    updateUi();
    draw();
    openMeasureEditor(measurements.length - 1);
    showToast('Tap the number to edit the measurement');
  }

  function sanitizeNumberValue(v) {
    return String(v == null ? '' : v).trim().slice(0, 10);
  }

  function renderNumberPalette() {
    if (!numberGridEl) return;
    numberGridEl.innerHTML = numberPalette.map(function(v, idx) {
      var isActive = selectedNumberValue === v;
      return '<button type="button" class="rb-number-item' + (isActive ? ' rb-active' : '')
        + '" data-num-idx="' + idx + '">' + v.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</button>';
    }).join('');
  }

  function setSelectedNumber(value) {
    var val = sanitizeNumberValue(value);
    if (!val) return;
    selectedNumberValue = val;
    renderNumberPalette();
  }

  function setNumberLibraryVisible(show) {
    if (!numberLibraryEl) return;
    numberLibraryEl.style.display = show ? 'block' : 'none';
  }

  function getPanelAnchors() {
    var panels = getDerivedPanels();
    var anchors = [];
    function norm(x, y) {
      var len = Math.sqrt(x * x + y * y);
      if (len < 0.001) return { x: 0, y: 0 };
      return { x: x / len, y: y / len };
    }
    function cornerInwardOffset(poly, idx, dist) {
      var n = poly.length;
      if (!n) return { x: 0, y: 0 };
      var c = poly[idx];
      var prev = poly[(idx - 1 + n) % n];
      var next = poly[(idx + 1) % n];
      var v1 = norm(prev.x - c.x, prev.y - c.y);
      var v2 = norm(next.x - c.x, next.y - c.y);
      var bis = norm(v1.x + v2.x, v1.y + v2.y);
      if (!bis.x && !bis.y) bis = v1;
      return { x: bis.x * dist, y: bis.y * dist };
    }
    function midpointInwardOffset(poly, a, b, dist) {
      var mx = (a.x + b.x) / 2;
      var my = (a.y + b.y) / 2;
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      var n1 = norm(-dy, dx);
      var n2 = norm(dy, -dx);
      var t1 = { x: mx + n1.x * dist, y: my + n1.y * dist };
      var t2 = { x: mx + n2.x * dist, y: my + n2.y * dist };
      if (pointInPolygon(t1.x, t1.y, poly)) return { x: n1.x * dist, y: n1.y * dist };
      if (pointInPolygon(t2.x, t2.y, poly)) return { x: n2.x * dist, y: n2.y * dist };
      return { x: 0, y: 0 };
    }
    for (var i = 0; i < panels.length; i++) {
      var poly = panels[i].polygon || [];
      if (poly.length < 2) continue;
      for (var j = 0; j < poly.length; j++) {
        var a = poly[j];
        var b = poly[(j + 1) % poly.length];
        var cOff = cornerInwardOffset(poly, j, NUMBER_CORNER_OFFSET);
        anchors.push({
          x: a.x, y: a.y, kind: 'corner', ox: cOff.x, oy: cOff.y,
          panelPoly: poly
        });
        var mOff = midpointInwardOffset(poly, a, b, NUMBER_MID_OFFSET);
        anchors.push({
          x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, kind: 'mid', ox: mOff.x, oy: mOff.y,
          panelPoly: poly
        });
      }
    }
    return anchors;
  }

  function nearestAnchor(x, y) {
    var anchors = getPanelAnchors();
    if (!anchors.length) return null;
    // Prefer anchors from the panel that contains the click. This allows
    // separate labels on shared corners (e.g. panel 4 BR vs panel 6 TR).
    var localAnchors = anchors.filter(function(a) {
      return a.panelPoly && pointInOrOnPolygon(x, y, a.panelPoly);
    });
    if (localAnchors.length) anchors = localAnchors;
    var best = null;
    var bestD2 = Infinity;
    for (var i = 0; i < anchors.length; i++) {
      var dx = anchors[i].x - x;
      var dy = anchors[i].y - y;
      var d2 = dx * dx + dy * dy;
      if (d2 < bestD2) {
        bestD2 = d2;
        best = anchors[i];
      }
    }
    var snapMax = (CLOSE_SNAP_PX * 1.6) * (CLOSE_SNAP_PX * 1.6);
    return bestD2 <= snapMax ? best : null;
  }

  function nearestCrackNumberPlacement(x, y) {
    var best = null;
    var bestD2 = Infinity;
    for (var ci = 0; ci < cracks.length; ci++) {
      var pts = cracks[ci].points || [];
      for (var pi = 0; pi < pts.length - 1; pi++) {
        var a = pts[pi];
        var b = pts[pi + 1];
        var vx = b.x - a.x;
        var vy = b.y - a.y;
        var len2 = vx * vx + vy * vy;
        if (len2 < 1e-6) continue;
        var t = ((x - a.x) * vx + (y - a.y) * vy) / len2;
        if (t < 0) t = 0;
        else if (t > 1) t = 1;
        var px = a.x + t * vx;
        var py = a.y + t * vy;
        var dx = x - px;
        var dy = y - py;
        var d2 = dx * dx + dy * dy;
        if (d2 < bestD2) {
          bestD2 = d2;
          best = { projX: px, projY: py, vx: vx, vy: vy };
        }
      }
    }
    if (!best) return null;
    var snapMax = (CLOSE_SNAP_PX * 1.2) * (CLOSE_SNAP_PX * 1.2);
    if (bestD2 > snapMax) return null;
    var len = Math.sqrt(best.vx * best.vx + best.vy * best.vy) || 1;
    var nx = -best.vy / len;
    var ny = best.vx / len;
    var side = best.vx * (y - best.projY) - best.vy * (x - best.projX);
    if (side < 0) { nx = -nx; ny = -ny; }
    return {
      x: Math.round((best.projX + nx * NUMBER_CRACK_OFFSET) * 10) / 10,
      y: Math.round((best.projY + ny * NUMBER_CRACK_OFFSET) * 10) / 10
    };
  }

  function updateDragChip(x, y, text, visible) {

        x: Math.round((anchor.x + (anchor.ox || 0)) * 10) / 10,

      };

  function drawXMarks() {

      ctx.beginPath();
      ctx.moveTo(m.x - h, m.y - h);

    });

  function drawCircles() {
    if (!circles.length && !circleDraft) return;

    ctx.lineWidth = STROKE_WIDTH;
    ctx.lineCap = 'round';
    circles.forEach(function(c, idx) {

  }
